name: Redigerarpanel

# Hämtar Notion, bygger panelen och publicerar den. Ingen terminal behövs —
# token:en ligger som ett GitHub-secret och allt körs här uppe.
#
# Kör: varje timme mellan 06 och 20 svensk tid, samt när du trycker på knappen.

on:
  schedule:
    - cron: '0 4-18 * * 1-5'   # UTC. 04-18 UTC = 06-20 svensk sommartid, mån-fre.
  workflow_dispatch:            # "Run workflow"-knappen i Actions-fliken

permissions:
  contents: write   # för att kunna spara händelseloggen mellan körningar
  pages: write
  id-token: write

concurrency:
  group: redigerarpanel
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kontrollera Notion-kopplingen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Hemligheten NOTION_TOKEN saknas. Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          cd dashboard && node cli.mjs check-notion

      - name: Hämta allt från Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: cd dashboard && node cli.mjs ingest notion-all

      # Meta får inte kunna sänka hela körningen. Notion-delen är det som mäter
      # arbetet; spend är ett tillägg. Kraschar Meta ska panelen ändå byggas.
      - name: Hämta Meta Ads
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          if [ -z "$META_ACCESS_TOKEN" ]; then
            echo "::warning::META_ACCESS_TOKEN saknas — spend och ersättning uppdateras inte."
            {
              echo "## ⚠ Ersättningen står stilla"
              echo ""
              echo "Hemligheten \`META_ACCESS_TOKEN\` är inte satt, så inga nya siffror hämtas från Meta."
              echo "Panelen visar fortfarande de dagar som redan är sparade, men de blir aldrig nyare."
              echo ""
              echo "Lägg in den: **Settings → Secrets and variables → Actions → New repository secret**,"
              echo "namn \`META_ACCESS_TOKEN\`."
            } >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          cd dashboard && node cli.mjs ingest meta

      - name: Bygg panelen
        # index.html också — annars serverar Pages en tom katalog.
        run: |
          cd dashboard
          node cli.mjs build
          cp dist/dashboard.html dist/index.html

      - name: Sammanfattning
        run: cd dashboard && node cli.mjs stats >> $GITHUB_STEP_SUMMARY

      # Händelseloggen måste överleva mellan körningar — det är den som gör att
      # ledtiderna byggs upp över tid. Utan det här börjar mätningen om varje gång.
      - name: Spara händelseloggen
        run: |
          git config user.name "Redigerarpanel"
          git config user.email "actions@github.com"
          git add -f dashboard/data/events.jsonl
          git add -f dashboard/data/meta-ads.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Uppdatera händelselogg [skip ci]"
          git push

      # Går alltid att ladda ner från körningen, även utan Pages.
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard/dist/dashboard.html

      - uses: actions/configure-pages@v5
        continue-on-error: true
        id: pages

      # Det här steget hoppades tyst över i 18 körningar i rad medan hela
      # körningen lyste grönt, eftersom continue-on-error gör att ett
      # misslyckat configure-pages ändå redovisas som lyckat. Resultatet: en
      # panel som ingen kunde öppna, och ingenting som sa det.
      - name: Säg till om Pages inte är påslaget
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Panelen publicerades INTE. GitHub Pages är inte påslaget för det här repot."
          {
            echo "## ⚠ Panelen ligger inte på webben"
            echo ""
            echo "Slå på den: **Settings → Pages → Source: GitHub Actions**. Sedan blir den nåbar på"
            echo "<https://axel3738.github.io/yognftnfgn/> vid nästa körning."
            echo ""
            echo "Obs: det här repot är **publikt**. Slår du på Pages kan vem som helst med länken"
            echo "läsa adspend, ROAS och vad varje redigerare tjänar. Vill du slippa det, gör repot"
            echo "privat först (Settings → General → Danger Zone → Change visibility)."
            echo ""
            echo "Så länge Pages är av: ladda ner panelen under **Artifacts** längst ner på den här sidan."
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: dashboard/dist

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    if: always() && needs.bygg.result == 'success'
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
