<?xml version="1.0" encoding="UTF-8"?>
<!-- Tankvakt — rund logga. Djupgrön cirkel (#1C2A1E) + ordmärket TANKVAKT
     i versaler, vitt, spärrad text. Bara namnet, fungerar i en färg.
     Rastrera 512×512 PNG och ladda upp till butikens Files i Shopify-steget. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="256" fill="#1C2A1E"/>
  <text x="256" y="256" fill="#F3F1E9"
        font-family="Archivo, 'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="700" letter-spacing="6"
        text-anchor="middle" dominant-baseline="central">TANKVAKT</text>
</svg>
