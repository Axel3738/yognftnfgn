# =============================================================
# OPS FACTORY — BUTIKSKONFIG (gäller HELA butiken, alla produkter)
# =============================================================
# Kopiera till factory/butiker/<id>.yaml. En fil per butik.
# Produktfilen beskriver produkten. Den här beskriver företaget bakom.
# Fält märkta KRITISKT stoppar systemet om de saknas.

butik:
  id: ""                      # KRITISKT — kort-id, ex: nackmagneten
  # NAMNREGELN (Axel 2026-09-07): namnet ska funka på VARJE marknad —
  # läsbart och uttalbart på både svenska och engelska, aldrig å/ä/ö.
  # Tänk namn som bär i .se, .no, .dk och .com utan att ändras.
  brand: ""                   # KRITISKT — namnet kunden ser
  bolagsnamn: ""              # KRITISKT — juridiskt namn i köpvillkoren
  orgnr: ""                   # KRITISKT
  adress: ""                  # KRITISKT — postadress i köpvillkoren
  supportmail: ""             # KRITISKT — alltid hello@<domän> (Axel 2026-09-08), aldrig hej@
  land: SE                    # KRITISKT — tvåbokstavskod där bolaget sitter
  huvudmarknad: Sverige       # KRITISKT — zonen som är hemmamarknad
  # STANDARD i varje OPS (Axel 2026-09-08): marknad Norge (locale nb) från
  # start — fler marknader = fler rader. NOK slås på i admin (API-spärrat),
  # så valutan står SEK tills dess (som DryTrek/TackleBay) — NOK-paketnivåer
  # krävs före norska annonser.
  # Raderna styr marknad.mjs (marknad + locale + webPresence), och
  # startsida.mjs härleder "Fri frakt – Sverige & Norge" ur huvudmarknad +
  # de här länderna. Landnamnet ska SYNAS för kunden — skriv aldrig
  # fraktländer för hand i startsidan, de kommer härifrån.
  marknader:
    - land: NO                # tvåbokstavskod: NO, DK, FI, DE, GB
      locale: nb              # Shopify-locale: nb, da, fi, de, en
      valuta: SEK             # NOK först när admin slagit på den
  valuta: SEK                 # KRITISKT — SEK, NOK, DKK, EUR, USD eller GBP
  # true = priserna inkluderar skatt. OPS-butikerna säljer MED moms (avläst
  # TankGuard 2026-09-09: shop.taxesIncluded = true), till skillnad från
  # Bäverbutiken. Break-even räknas då på nettot (pris / 1,25 − inköp).
  moms_i_pris: true
  # SVENSKA MARKÖRER — butikens EGNA ord (rubriker, knapptexter, produktord)
  # som aldrig får stå kvar på en översatt sida (/nb, /da …). kundvy.mjs
  # skannar de översatta sidorna efter exakt de här orden; ingen lista finns
  # i koden ("överdrag" är TankGuards ord, inte varje butiks — KEDJAN.md
  # regel 7). Utan listan hoppas skanningen över och rapporteras som manuell,
  # aldrig som grön. Ord som är lika på målspråket filtreras bort av sig själva.
  markorer_sv:
    - "Köp nu"
    - "Fri frakt"
    - "Vanliga frågor"
  # FLERPRODUKTSBUTIK (två eller fler produktfiler i samma körning): startsidan
  # visar KOLLEKTIONEN, inte en enskild produkt, och menyn får en rad till den.
  # Enproduktsbutik: lämna blocket borta — startsidan visar produkten direkt.
  # (factory/FLERPRODUKT.md, TackleBay 2026-09-09.)
  kollektion:
    handle: sortimentet       # /collections/<handle>
    titel: "Sortimentet"      # rubrik på startsidan och i menyn
    beskrivning: ""           # HTML, ex "<p>Utrustning för den som fiskar.</p>"

frakt:
  fri_globalt: true           # fri frakt till alla länder (default)
  leveranstid: "5–8 arbetsdagar"   # standard, produktfilen kan skriva över
  express:                    # snabbfrakt på huvudmarknaden, valfri
    aktiv: false
    namn: "Express"
    pris: 99
    tid: "1–2 arbetsdagar"
  # Sätts bara om fri_globalt är false:
  standardpris: 0
  fri_over: 0                 # 0 = ingen gräns

retur:
  # Axels beslut 2026-09-08: alltid svensk lag, ALDRIG egna köplöften —
  # "30 dagars öppet köp" överallt har ruinerat folks trust. 14 = lagens
  # ångerrätt, sätt aldrig högre.
  oppet_kop_dagar: 14
  angerratt_dagar: 14         # lagstadgat i Sverige, ändra inte utan skäl
  reklamation_ar: 3           # konsumentköplagen
  returfrakt_betalas_av: kund # kund eller butik
  aterbetalning_dagar: 14

garantier:                    # butikens basgarantier, visas på varje produkt
  - "14 dagars ångerrätt"

policy:
  tvistlosning: "Allmänna reklamationsnämnden"
  visa_odr_lank: true         # EU:s tvistlösningsplattform
  svarstid: "en arbetsdag"

# BRAND-CONFIG — butikens egen visuella identitet. Skrivs FÖRE theme-bygget,
# från noll för varje butik, utifrån: vem som köper, vilket problem de löser,
# vilken emotion som driver köpet och vilken sorts brand de förväntar sig att
# lita på (premium/trygg/teknisk/familjär/feminin/minimalistisk …).
# Temats STRUKTUR återanvänds mellan butiker — brandingen ALDRIG.
# Saknas blocket används neutrala, avsiktligt trista tokens.
branding:
  positionering: ""           # en mening: vad brandet är för vem
  tonalitet: ""               # hur texten låter
  kansla: ""                  # 3–4 ord: trygg, premium, teknisk …
  farger:                     # hex — hela sajtens palett genereras härifrån
    bakgrund: "#FFFFFF"
    yta: ""                   # ljus sektionsyta
    yta_djup: ""
    mork: ""                  # mörka sektioner, annonsrad, sidfot
    text: ""
    text_pa_mork: ""
    linje: ""
    linje_stark: ""
    accent: ""                # CTA-färgen — den enda som får ropa
    accent_text: "#FFFFFF"
    god: ""                   # bockar/bekräftelse
    varning: ""
  typografi:
    rubriker: ""              # Shopify-fonthandle, ex archivo_n6
    brodtext: ""              # ex dm_sans_n4
  form:
    knapp_radius: 10
    kort_radius: 12
    input_radius: 10
    badge_radius: 8
  stil:                       # riktning i ord — för den som gör logga/bilder/copy
    ikoner: ""
    bilder: ""
    rubrikstil: ""
    cta: ""
    trust: ""
    spacing: ""
    logo: ""                  # logo direction
    favicon: ""               # favicon direction

# ---------------------------------------------------------------------------
# STARTSIDAN — skrivs av factory/startsida.mjs till templates/index.json
# (steget `startsida` i ops.mjs). Utan det här blocket ärver butiken
# Matstrumpors startsida ur bas-zip:en: deras hero, deras recensioner,
# deras FAQ (Axels bakläxa 2026-09-09 på DryTrek).
#
# Copyn här är SVENSK. Norskan (och varje annat språk) skrivs av en subagent
# som en egen text i output/<butik>/oversattning-<locale>.json och läggs på
# med marknad.mjs — aldrig i den här filen, aldrig av koden.
#
# TEXTREGLER: repots YAML-läsare stödjer inte flerradiga block (| och >).
# Skriv ett stycke per listrad och citera rader som innehåller kolon.
# Utelämnade fält får neutrala defaults härledda ur butikens EGNA villkor
# (frakt, retur, marknader) — aldrig ur en annan butiks text.
#
# BILDER: ange käll-URL eller filnamn. ops.mjs laddar upp via filer.mjs och
# ger startsida.mjs den lagrade handlen (shopify://shop_images/<namn.ext>).
# Ett filnamn skrivs ALDRIG rakt in i temat — tomt = temats platshållare.
# ---------------------------------------------------------------------------
startsida:
  usp:                        # ikon:text per rad; ikoner: truck, shield, refresh, check, star, lock
    - ""
  hero:
    rubrik: ""                # tom = brandnamnet
    text: ""
    knapp: ""                 # tom = "Handla nu". Länken sätts av koden: kollektionen eller produkten.
    bild: ""                  # käll-URL eller filnamn; tom = temats platshållare
  marquee:                    # det rullande bandet; tom = frakt + ångerrätt + trygg betalning
    - ""
  sortiment_rubrik: ""        # bara flerproduktsbutik; tom = kollektion.titel
  produkt_etikett: ""         # bara enproduktsbutik, liten text över titeln; tom = inget block
  berattelse:
    rubrik: ""                # tom = brandnamnet
    text:                     # ett stycke per rad
      - ""
  galleri:                    # valfritt; utelämnas helt när kolumner saknas
    rubrik: ""
    kolumner:                 # max 3, i den ordning de visas
      - titel: ""
        bild: ""              # käll-URL eller filnamn
    markning: ""              # ex "Miljöbilderna är AI-genererade illustrationer" — BARA om det är sant
  statement:                  # ett påstående + knapp på mörk yta; utelämnas när rubriken är tom
    rubrik: ""
    knapp: ""                 # tom = "Se sortimentet" (flera) / "Handla nu" (en)
  omdomen:                    # sektionen visar ENDAST riktiga reviews ur produktfilerna
    eyebrow: ""               # tom = "Verifierade köp"
    rubrik: ""                # tom = "Vad kunderna säger"
  trygghet:
    rubrik: ""                # tom = "Handla tryggt hos oss"
    text:                     # tom = frakt + ångerrätt ur butikens villkor
      - ""
    bild: ""                  # käll-URL eller filnamn
  faq_rubrik: ""              # tom = "Vanliga frågor"
  faq:                        # utelämnas helt utan frågor; svaret ett stycke per rad eller en sträng
    - fraga: ""
      svar: ""
  garanti:
    rubrik: ""                # tom = "<retur.angerratt_dagar> dagars ångerrätt"
    text:                     # tom = härledd ur retur + supportmail
      - ""
