# Beskrivningens sju block, texterna ordagrant från källsidan på Bäverbutiken.
beskrivning:
  problem_rubrik: "Regnvattnet grönskar innan sommaren ens börjat"
  problem_text: "Solljus rakt in i tanken får alger att växa i vattnet, och UV-strålningen gör plasten spröd år för år. Presenningen som skulle skydda blåser av vid första höststormen."
  losning_rubrik: "Ett överdrag som håller ljuset ute och tanken hel"
  losning_text: "Trä överdraget över tanken och stäng dragkedjan – det gröna 210D-oxfordtyget stänger ute ljuset så algerna aldrig kommer igång, och tar solen i stället för plasten. Öppningen upptill gör att du kommer åt locket utan att ta av något, och måtten 120 × 100 × 116 cm passar en standardtank på 1000 liter."

vinkel:
  huvudvinkel: "Regnvattnet grönskar av alger och UV gör tanken spröd — överdraget stänger ute ljuset och räddar både vattnet och tanken (källa: bevisad produktsida på Bäverbutiken, samma copy)"
  underrubrik: "Stäng ute solljuset som får algerna att växa – och skydda tanken från att bli spröd i UV:t."

malgrupp:
  beskrivning: "Villa-, koloni- och trädgårdsägare som samlar regnvatten i en 1000-liters IBC-tank för bevattning, trötta på grönt algevatten, en tank som blir spröd i solen och presenningar som blåser av"

problem:
  - "Solljus i tanken får algerna att växa – regnvattnet grönskar"
  - "UV-strålningen gör plasten spröd år för år så tanken åldras i förtid"
  - "Presenningen som skulle skydda blåser av vid första höststormen"

benefits:
  - "Vattnet håller sig klart – tyget stänger ute ljuset som får alger att växa"
  - "Tanken åldras inte i solen – 210D-tyget tar UV-strålningen i stället för plasten"
  - "Locket alltid åtkomligt – öppning upptill, fyll på utan att ta av överdraget"
  - "På och av med dragkedja – ingen kamp med presenning och gummiband"
  - "Passar standardtanken – 120 × 100 × 116 cm för 1000-liters IBC"

features:
  - "Grönt 210D oxfordtyg som stänger ute ljus och tål UV"
  - "Måtten 120 × 100 × 116 cm passar en standard 1000-liters IBC-tank"
  - "Öppning upptill – kom åt locket utan att ta av överdraget"
  - "Dragkedja för enkel på- och avtagning"
  - "För utomhusbruk – skyddar mot sol, regn och väder"

