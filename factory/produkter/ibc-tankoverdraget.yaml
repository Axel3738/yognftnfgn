faq:
  - fraga: "Vilken tank passar överdraget?"
    svar: "Måtten är 120 × 100 × 116 cm och passar en standard 1000-liters IBC-tank."
  - fraga: "Hur kommer jag åt locket för att fylla på?"
    svar: "Det finns en öppning upptill – du kommer åt locket utan att ta av överdraget."
  - fraga: "Stoppar det verkligen algerna?"
    svar: "Ja, tyget stänger ute ljuset som algerna behöver för att växa, så vattnet håller sig klart."
  - fraga: "Tål det att sitta ute året om?"
    svar: "Ja, det gröna 210D-oxfordtyget är gjort för utomhusbruk och tål sol, regn och väder."
  - fraga: "Hur sätter jag på och av det?"
    svar: "Du trär det över tanken och stänger dragkedjan – ingen kamp med presenning och gummiband."
  - fraga: "Hur lång är leveranstiden?"
    svar: "5–8 arbetsdagar med fri frakt."
  - fraga: "Vad händer om jag inte blir nöjd?"
    svar: "30 dagars öppet köp – gillar du det inte får du pengarna tillbaka."

