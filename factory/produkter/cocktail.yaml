faq:
  - fraga: "Innehåller kalendern alkohol eller riktiga miniflaskor?"
    svar: "Nej. De 24 flaskorna är dekorationer i akryl, utan öppning eller innehåll – hela kalendern väger bara 100 gram, vilket inte går ihop med fyllda flaskor. Det här är pynt, inte dryck."
  - fraga: "Vad är flaskorna gjorda av?"
    svar: "Akryl (2D-akryl enligt leverantören), platta med en liten metallögla i toppen så de går att hänga i gran, fönster eller på hylla."
  - fraga: "Hur fungerar luckorna?"
    svar: "Asken har 24 numrerade luckor (1–24), en per dag fram till julafton, kopplade till de 24 flaskorna. Vi kan inte bekräfta exakt hur öppningsmekaniken ser ut utifrån produktbladet."
  - fraga: "Vilka cocktails är med?"
    svar: "Etiketterna vi kan läsa av visar bland annat Martini, Margarita, Mojito, Old Fashioned, Cosmopolitan, Mai Tai, Espresso Martini, Gin & Tonic, Piña Colada, Rum Punch, Tom Collins, Negroni, Whiskey Sour och Manhattan. Alla 24 flaskor har ett tryckt cocktailnamn, men vi kan inte garantera exakt vilka 24 som följer med just din kalender."
  - fraga: "Finns det en åldersgräns?"
    svar: "Nej, ingen åldersmärkning står på förpackningen – kalendern är gjord för vuxna med tanke på cocktailtemat, inte för barn."
  - fraga: "Hur lång är leveranstiden och vad gäller om jag ångrar mig?"
    svar: "Leveranstiden är 5–10 arbetsdagar, med fri frakt till både Sverige och Norge. Du har 14 dagars ångerrätt från att du fått paketet."

