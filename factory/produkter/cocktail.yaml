beskrivning:
  problem_rubrik: "Vuxna får sällan en egen adventskalender"
  problem_text: "Chokladkalendrar och julgranspynt med tomtar är gjorda för barn, inte för den som hellre pratar cocktails än pepparkakor. Den som vill pynta hemmabaren eller julgranen med något som matchar sitt intresse för drinkar får leta länge i vanliga julbutiker. Kvar blir samma glögg-tema som förra året."
  losning_rubrik: "En cocktailkalender, inte en barnkalender"
  losning_text: "Kalenderaskens 24 numrerade luckor hör ihop med 24 platta cocktailflaskor i akryl – Martini, Mojito, Negroni och fler namn tryckta på var och en. Alla har en liten metallögla, så de går rakt upp i granen, fönstret eller hemmabaren. Helt utan alkohol: det är ren dekoration, inget att dricka, så den funkar lika bra som kontorspynt som hemma i vardagsrummet."

vinkel:
  huvudvinkel: "24 flaskor, noll alkohol — ur verifierade fakta om varan, En kartongkalender med 24 numrerade luckor som innehåller 24 platta hängprydnader i akryl"
  underrubrik: "24 cocktailflaskor i akryl att hänga upp – ren dekoration, inget att dricka."
  usp: "24 flaskor, noll alkohol"

malgrupp:
  beskrivning: "Vuxen som gillar cocktails, bardekor eller julpynt med attityd – till sig själv eller som julklapp till någon som hellre pratar drinkar än choklad."

problem:
  - "Chokladkalendern är slut efter en vecka."
  - "Julgranspynt med tomtar och stjärnor känns likadant år efter år."
  - "Presenttips till den som gillar cocktails och bardekor är svåra att hitta i vanliga julbutiker."

benefits:
  - "En ny cocktailflaska att hänga upp varje dag fram till julafton – 24 olika namn, från Martini till Negroni."
  - "Kalendern lever vidare efter jul: flaskorna går att ta fram och hänga upp igen nästa december."
  - "Fungerar lika bra på jobbet, i hemmabaren eller i julgranen hemma – ingen choklad att strö omkring."
  - "Helt fri från alkohol, så den går att ge bort utan att fundera på vem som får dricka vad."

features:
  - "Kalenderask med 24 numrerade luckor (1–24), ca 26 × 18 × 3 cm."
  - "24 platta cocktailflaskor i akryl (2D), varje med metallögla för upphängning."
  - "Tryckta cocktailnamn, bland annat Martini, Mojito, Negroni och Manhattan."
  - "Total vikt 100 g. Inget drickbart innehåll – ren dekoration."

