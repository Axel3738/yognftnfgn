# CaraShell — produkt 2: Termoskydd Husbil 211 × 171 cm (utvändigt, mörkläggande).
# Källa: baverbutiken.se/products/termoskydd-husbil-211-171-cm-utvandigt-och-morklaggande
# Tillagd 2026-09-16 med /ops-produkt carashell <källänk> (factory/ops-produkt.mjs
# skrev utkastet; resten skrevs samma session). Specs, pris och recensioner
# lästa ur källans /products/<handle>.json + Judge.me 2026-09-16.
#
# BILDERNA: bara EN är ett foto (b6-termoskydd-se.jpg, skyddet på en husbil).
# De två andra är AI-genererade illustrationer — källsidan skriver det själv
# ("Miljöbilderna är AI-genererade illustrationer"), och det står kvar i
# alt-texten här så bilden aldrig blir ett påstående. Inget demo-mp4 finns i
# källan; källans egen sida bär bara de tre bilderna.
# Okänt och därför aldrig påstått: material, vikt, isolervärde, förvaringspåse.
#
# Copyn (svenska) skrevs 2026-09-16 av en subagent (sonnet) ur BRAND.md +
# docs/copy-regler.md, tre-frågorstestet ✅ på alla rubrikrader; vinkel,
# målgrupp och struktur är huvudsessionens.
#
# ⚠️ ANDRA PRODUKTEN I BUTIKEN. Eget creative_prefix (CaraShellFront), eget
# kalla:-block, egen kampanj och egen rutinplats — delas ALDRIG med
# takskyddet (factory/FLERPRODUKT.md). Pixeln är butikens och delad: Metas
# köp-event bär ingen produkt, så ett köp av takskyddet (1 129 kr) kan
# bokföras på termoskyddets kampanj och tvärtom. Läs köp per produkt ur
# Shopify innan en annons döms — prisavståndet är 2×, inte brus.

produkt:
  namn: "Termoskydd Husbil 211 × 171 cm"
  id: "termoskyddet"
  menynamn: "Termoskyddet"

brand:
  namn: "CaraShell"
  domanideer:
    - "carashell.se"
    - "carashell.no"

ekonomi:
  # MOMSEN: räknas UTAN moms (Axels besked 2026-09-09, samma regel som
  # Bäverbutiken och Grillkliniken). Marginalen räknas rakt på priset.
  moms_antagen: false
  # ⚠️ HÄRLEDD, inte kvitterad — samma väg som takskyddet: källkampanjens
  # namn bär "BE ROAS 1.61" och docs/temu-launch-flow.md säger
  # BE-ROAS = pris / (pris − inköp) ⇒ 559 − 559/1,61 = 212 kr. Axel sköter
  # COGS på annat håll (besked 2026-09-16) — byt talet när han ger det.
  inkopskostnad: 212
  pris: 559
  jamforpris: 932
  # Ur källkampanjens namn (MagiBorsten 120250175763810291, läst 2026-09-16).
  break_even_roas: 1.61
  # FASTA PRISER PER MARKNADSVALUTA — samma regel som takskyddet (Axels val
  # 2026-09-11): NOK-priset i takskyddets kurs (1 106 / 1 129 = 0,9796) och
  # jämförpriset 25 % över priset. 559 × 0,9796 = 548 NOK, 548 × 1,25 = 685.
  # ⚠️ Prislistan gid://shopify/PriceList/33455505740 ("Norge") får det fasta
  # priset via priceListFixedPricesAdd EFTER att produkten finns i butiken —
  # API-GRANSER.md, tre anrop. Ingen fabrikskod gör det; ops-produkt-sessionen
  # kör anropet och skriver resultatet i kommentaren nedan.
  marknadspriser:
    - valuta: NOK
      pris: 548
      jamforpris: 685
    # USD — Axels beslut 2026-09-16 ("OK TERMOSKYDDET SKA KOSTA 99 DOLLAR"),
    # svar på /ny-marknad-rapportens fråga (alternativen var 59 = kursen,
    # 99 = samma påslag som takskyddet, 1,72×). Inte en kursomräkning
    # (559 kr × 0,10235 = 57,21 USD). Jämförpriset följer samma regel som
    # NOK och takskyddet: 25 % över priset (123,75 → 124). Fast pris i
    # prislistan "CaraShell USD" (prislista.mjs) — innan raden fanns visade
    # Shopify sin egen omräkning, $59.00, för amerikanska kunder.
    - valuta: USD
      pris: 99
      jamforpris: 124
    # EUR — Finland 2026-09-18. Axels finska prislista gäller takskyddet, och
    # den ger faktorn 126,90/1 129 = 0,1124 (landad kostnad 26,5 % över
    # Sverige, inte kursen). 559 × 0,1124 = 62,83 ⇒ 62,90 €, jämförpriset
    # 25 % över som för NOK och USD (78,63 ⇒ 78,90). Utan raden hade finska
    # kunder sett SEK på termoskyddet medan takskyddet visade euro.
    # ✅ Framräknat av sessionen, GODKÄNT av Axel 2026-09-18 ("kör på").
    - valuta: EUR
      pris: 62.90
      jamforpris: 78.90
    # DKK — Danmark 2026-09-20. Axels beslut samma dag: "kör ett snäpp högre,
    # danska quotes brukar vara dyrare än Sverige med kanske 10 %". Alltså
    # SEK × 0,66204 (ECB 2026-09-18) × 1,10, avrundat till x9 — 559 → 409 DKK.
    # Jämförpriset räknas likadant ur SEK-jämförpriset (932 → 679), så
    # rabattprocenten blir densamma som i Sverige (40 %). Det är ett annat
    # grepp än NOK/USD/EUR, som alla bär 25 % över priset — här följer
    # jämförpriset den svenska sidan i stället, eftersom den är källan.
    - valuta: DKK
      pris: 409
      jamforpris: 679

