beskrivning:
  problem_rubrik: "Imman sitter kvar mellan gardin och glas"
  problem_text: "Fukten från natten lägger sig på insidan av vindrutan, och en gardin gör bara att den blir kvar mellan glaset och tyget. Morgonsolen gör sedan kupén trettio grader varm innan frukosten är klar, och på en rastplats ser alla som går förbi rakt in."
  losning_rubrik: "CaraShell sitter utanpå rutan"
  losning_text: "Skyddet spänns utvändigt över vindrutan och båda sidorutorna, så glaset aldrig hinner bli kallt inifrån. Det mörklägger samtidigt hela framvagnen: ingen ser in, och morgonsolen väcker dig inte klockan fyra. Två minuters jobb på utsidan i stället för imma att torka bort varje dag."

vinkel:
  huvudvinkel: "Konflikt typ A – invändig gardin/solskydd mot utvändigt skydd. Imman sitter på insidan därför att glaset blir kallt; ett skydd innanför glaset kan inte ändra det, ett skydd utanpå gör det. Tre konkreta scener: imma att torka bort varje morgon, trettio grader i kupén före frukost, insyn på rastplatsen. Källa: källkampanjen 'Termoskyddet för Husbil 211 × 171 cm' i MagiBorsten (16 annonser, 40 köp på 7 013 kr, ROAS 3,25 per 2026-09-16; bevisad rad 'Svalt på sommaren, varmt på vintern, mörkt när du sover' i CS_2/CS_3, och SP_2:s 'Efter en sommar med det här skulle vi aldrig åka utan') och källsidans egen ingress 'Rutan är immig inifrån varje morgon'."
  underrubrik: "Utvändigt termoskydd, 211 × 171 cm, som håller kylan och solen borta från vindruta och sidorutor och mörklägger framvagnen när du sover i bilen."
  usp: "Svalt. Mörkt. Ingen imma."

malgrupp:
  beskrivning: "Husbilsägare 45–70 som sover i bilen på rastplatser, ställplatser och campingar, vår till höst och gärna vinterresor. Säger 'kupén', 'framrutan', 'ställplats' och 'imma', har provat invändiga gardiner och vet att imman ändå sitter kvar på morgonen."

