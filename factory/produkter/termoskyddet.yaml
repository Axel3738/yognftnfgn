faq:
  - fraga: "Passar skyddet min husbil?"
    svar: "Måtten är 211 cm bred, 171 cm över mitten och 90 cm sidflikar, och skyddet täcker vindrutan och båda sidorutorna på framvagnen. Mät din framruta och jämför innan du beställer."
  - fraga: "Hur monterar jag skyddet?"
    svar: "Skyddet spänns utvändigt över vindrutan och sidorutorna, och flikarna kläms fast i dörrkarmen. Dörrarna behöver inte öppnas."
  - fraga: "Sitter det kvar i blåst?"
    svar: "Ja, flikarna som kläms i dörrkarmen håller skyddet på plats i blåst."
  - fraga: "Mörklägger det så ingen ser in?"
    svar: "Ja, skyddet täcker hela framvagnen och mörklägger den, så ingen på rastplatsen ser in och morgonsolen väcker dig inte i gryningen."
  - fraga: "Vad gäller om jag ångrar mig?"
    svar: "14 dagars ångerrätt enligt svensk lag. Mejla hello@carashell.se."

