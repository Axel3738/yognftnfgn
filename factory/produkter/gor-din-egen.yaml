beskrivning:
  problem_rubrik: "Färdiga kalendrar bestämmer åt dig"
  problem_text: "Du vill ge en adventskalender som känns vald för just den personen, inte 24 saker en fabrik redan bestämt. De färdigfyllda kalendrarna har nästan alltid 24 likadana fack oavsett vad som ska ligga i dem, så en present som inte har exakt rätt storlek får helt enkelt inte plats."
  losning_rubrik: "Tomt när den kommer, fyllt på ditt sätt"
  losning_text: "Den här adventskalendern kommer helt tom: inget innehåll medföljer, du väljer och fyller alla 24 sakerna själv. Askarna är olika stora (minsta 3 × 4,5 × 7 cm, största 7 × 24,5 × 7 cm), så en present får plats i rätt fack i stället för att tvingas in i samma mått som allt annat. Locket fälls upp som en bok och visar alla 24 numrerade askar på en gång, så du ser vad som redan är fyllt och vad som är kvar."

vinkel:
  huvudvinkel: "24 storlekar. Du fyller. — ur verifierade fakta om varan, En TOM adventskalender: en stor presentask i hårdpapp med 24 numrerade småaskar som köpare"
  underrubrik: "En stor ask med 24 egna askar i olika storlekar – helt tom, du bestämmer vad som kommer bakom varje lucka."
  usp: "24 storlekar. Du fyller."

malgrupp:
  beskrivning: "Vuxen som vill göra en egen, personlig adventskalender åt en partner, ett barn eller en vän och själv väljer vad som ska ligga bakom var och en av de 24 luckorna."

problem:
  - "Färdigfyllda kalendrar har samma 24 saker för alla, oavsett vem som öppnar luckan."
  - "24 likadana fack rymmer bara presenter av en och samma storlek."
  - "Vill du lägga i en biljett, ett smycke eller en lapp med en hälsning finns sällan ett fack som passar."
  - "Att köpa ihop och sätta samman 24 lösa askar på egen hand blir fort krångligare än det låter."

benefits:
  - "Du bestämmer exakt vad mottagaren får bakom varje lucka, i stället för ett fabriksval."
  - "Olika askstorlekar gör att både en liten lapp och en klumpigare present får ett eget fack."
  - "Locket visar alla 24 askar på en gång, så du ser i förväg vilka som saknar innehåll."
  - "Bandhandtaget gör att hela kalendern går att bära som en väska, till exempel när den ska ges bort färdigfylld."

features:
  - "Ytterask 34 × 30,5 × 8 cm, väger 805 g, med bandhandtag i locket"
  - "24 numrerade askar (1–24) i 24 olika storlekar, alla 7 cm djupa"
  - "Minsta ask 3 × 4,5 × 7 cm, största 7 × 24,5 × 7 cm"
  - "Hårdpapp klädd med bestruket papper, fyrfärgstryck"
  - "Varje ask har eget nummer och egen jultryckt illustration (snögubbe, gran, ljusslinga, kula, strumpa)"
  - "Levereras helt tom – inget innehåll medföljer"

