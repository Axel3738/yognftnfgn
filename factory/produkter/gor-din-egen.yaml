faq:
  - fraga: "Följer det med något i askarna?"
    svar: "Nej. Kalendern levereras helt tom – ytterasken och alla 24 småaskar, men inget innehåll. Du väljer och fyller själv."
  - fraga: "Går askarna att öppna och stänga flera gånger, eller bara en gång?"
    svar: "Vi kan inte lova att de håller för att öppnas om och om igen år efter år – leverantören anger ingenting om det. Hantera dem varsamt om du vill spara kalendern till nästa jul."
  - fraga: "Hur stora är askarna, och vad får plats?"
    svar: "De 24 askarna är 7 cm djupa och olika breda: minsta 3 × 4,5 × 7 cm, största 7 × 24,5 × 7 cm. Det är de mått vi har, så mät gärna det du tänker lägga i innan du väljer fack."
  - fraga: "Är det någon åldersgräns eller varningstext på förpackningen?"
    svar: "Vi har ingen uppgift om åldersmärkning eller varningstext på den här produkten."
  - fraga: "Hur lång är leveranstiden och kostar frakten något?"
    svar: "Frakten är fri i Sverige och Norge, och leveranstiden är 5–10 arbetsdagar."
  - fraga: "Vad gäller om jag vill lämna tillbaka kalendern?"
    svar: "Du har 14 dagars ångerrätt från att du fått paketet."

