  - "Mått 120 × 100 × 116 cm, för 1000-liters IBC-tank"
  - "Dragsnören nertill som håller överdraget på plats"

offer:
  beskrivning: "489 kr i stället för 636 kr"
  # A = källans Kaching-nivåer, lästa ur den publika produktsidans
  # deal-block 2026-09-08: 1x (ordinarie), 2x −15 % "+ Fri Frakt" (FÖRVALD i
  # källan), 3x −21 %. Priserna avrundade till hela kronor: 831 / 1 159.
  # B = testoffer: rundare priser under 800/1 100-gränsen + större bonus i
  # 3-packet. Hypotes: rundare pris + "köp mer, få mer" höjer AOV mer än
  # rabatten kostar. Förvalsregeln (Axel 2026-09-07): mitten alltid förvald.
  # Antalsregeln (Axels beslut 2026-09-08): gratis-antalet följer paketantalet
  # — 2-pack ⇒ 2 kranskydd, 3-pack ⇒ 3. Nivå 1 får en betald kryssruta för
  # kranskyddet till FULLPRIS 199 kr (aldrig rabatterad — håller "värde 199
  # kr" ärligt). Rabattkoderna är fasta belopp som täcker rabatt + bonusens
  # värde så kassapriset stämmer på kronan (paket.mjs räknar):
  #   PAKET2  = 2×489 + 2×199 − 831  = 545 kr (min 4 varor)
  #   PAKET3  = 3×489 + 3×199 − 1159 = 905 kr (min 6 varor)
  #   PAKET2B = 2×489 + 2×199 − 799  = 577 kr (min 4 varor)
  #   PAKET3B = 3×489 + 3×199 − 1099 = 965 kr (min 6 varor)
  bundle: "A (original): 1 st 489 kr (+ kranskydd 199 kr som tillval), 2-pack 831 kr FÖRVALD (−15 %, PAKET2, 2 kranskydd gratis), 3-pack 1 159 kr (−21 %, PAKET3, 3 kranskydd gratis). B (test): 1 st 489 kr, 2-pack 799 kr FÖRVALD (PAKET2B, 2 kranskydd gratis), 3-pack 1 099 kr (PAKET3B, 3 kranskydd gratis)."
  # Maskinläsbar form av raden ovan — factory/paket.mjs bygger ms_paketniva-
  # metaobjekten + rabattkoderna härifrån. En rad per nivå; "pris" är
  # paketets kassapris i kronor, "kod" rabattkoden som ger exakt det priset.
  # Nivå utan pris/kod = ordinarie (1 st). Förvald = mitten (⌈n/2⌉).
  paket:
    test: "paket"
    nivaer:
      - variant: a
        antal: 1
        rubrik: "1 överdrag"
      - variant: a
        antal: 2
        rubrik: "2 överdrag"
        underrubrik: "För två tankar"
        pris: 831
        kod: "PAKET2"
        bricka: "Spara 15 %"
        gratis_antal: 2
        gratis_text: "2 × Kranskydd Frost 420D – skyddar utekranarna i vinter"
        forvald: true
      - variant: a
        antal: 3
        rubrik: "3 överdrag"
        underrubrik: "För tre tankar"
        pris: 1159
        kod: "PAKET3"
        bricka: "Spara 21 %"
        gratis_antal: 3
        gratis_text: "3 × Kranskydd Frost 420D – skyddar utekranarna i vinter"
      - variant: b
        antal: 1
        rubrik: "1 överdrag"
      - variant: b
        antal: 2
        rubrik: "2 överdrag"
        underrubrik: "För två tankar"
        pris: 799
        kod: "PAKET2B"
        bricka: "Spara 18 %"
        gratis_antal: 2
        gratis_text: "2 × Kranskydd Frost 420D – skyddar utekranarna i vinter"
        forvald: true
      - variant: b
        antal: 3
        rubrik: "3 överdrag"
        underrubrik: "För tre tankar"
        pris: 1099
        kod: "PAKET3B"
        bricka: "Spara 25 %"
        gratis_antal: 3
        gratis_text: "3 × Kranskydd Frost 420D – skyddar utekranarna i vinter"
  # Q4-ramverket (standard för varje OPS): bonusprodukten är Bäverbutikens
  # Kranskydd Frost 420D (Temu 601101411598143) — samma köpare (utekran och
  # regnvattentank på samma tomt), Q4-säsong (frost), och billig: batch #3-
  # sheeten säger 1,2 + 6,2 = 7,4 EUR + 2,9 tull ≈ 115 kr. Säljs i korgen
  # för 199 kr (Bäverbutiken tar 309 kr). Bilderna 1, 2 och 4 saknar text;
  # bild 3 (svensk måttbild) används inte.
  bonus_produkt:
    titel: "Kranskydd Frost 420D – Skyddar Utekranen i Vinter"
    handle: "kranskydd-frost"
    produkt_id: "15989725593944"
    variant_id: "58420897481048"
    pris: 199
    i_paket: "Antalsregeln: 2 st gratis i 2-pack, 3 st i 3-pack (A och B). Nivå 1: betald kryssruta till fullpris 199 kr."
    # Fullpris-kryssrutan på nivå 1 (tema.mjs → byggTillagg): aldrig rabatterad.
    tillagg_kryssruta: true
    kortnamn: "Kranskydd Frost"
    sku: "TEMU-601101411598143"
    # Bilder och text ordagrant från källsidan på Bäverbutiken (block 1/3/5).
    bilder:
      - "https://cdn.shopify.com/s/files/1/1013/0322/2621/files/temu3-kranskydd-1.jpg?v=1787226593"
      - "https://cdn.shopify.com/s/files/1/1013/0322/2621/files/kranskydd-pa-kran.jpg?v=1787331844"
      - "https://cdn.shopify.com/s/files/1/1013/0322/2621/files/kranskydd-studio.jpg?v=1787331845"
    problem_rubrik: "En sprucken vattenledning upptäcks alltid för sent"
    problem_text: "Första riktiga köldknäppen fryser vattnet i utekranen. Isen spränger kran eller ledning – och skadan syns först när allt tinar och läcker."
    losning_rubrik: "En vinterjacka för kranen"
    losning_text: "Trä skyddet över kranen och dra åt – det isolerande fodret håller frosten borta hela vintern. 420D Oxford-tyg på utsidan tål snö, regn och is."
    features:
      - "Kranen klarar köldknäpparna – tjockt isolerande foder håller frosten ute"
      - "Sitter på hela vintern – dragsko sluter tätt runt röret"
      - "Tål väder i månader – slitstarkt 420D Oxford-tyg"
      - "Monteras på tio sekunder – träs över kranen, inga verktyg"
      - "Rymligare än de flesta kranskydd – 22 × 14 cm, når ända in till väggen"

