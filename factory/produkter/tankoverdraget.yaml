faq:
  - fraga: "Passar överdraget min tank?"
    svar: "Måtten är 120 × 100 × 116 cm och passar en standardtank på 1000 liter."
  - fraga: "Kommer jag åt locket när överdraget sitter på?"
    svar: "Ja, öppningen upptill gör att du fyller på och kommer åt locket utan att ta av något."
  - fraga: "Varför blir vattnet i tanken grönt?"
    svar: "Solljus rakt in i tanken får alger att växa. Tyget stänger ute ljuset så algerna aldrig kommer igång."
  - fraga: "Hur sätter jag på det?"
    svar: "Trä överdraget över tanken och stäng dragkedjan – inga verktyg, ingen presenning och inga gummiband."
  - fraga: "Hur lång är leveranstiden?"
    svar: "6–10 arbetsdagar med fri frakt inom Sverige."
  - fraga: "Kan jag ångra köpet?"
    svar: "Ja, du har 14 dagars ångerrätt enligt distansavtalslagen. Mejla hello@tankguard.se så får du en returinstruktion."

