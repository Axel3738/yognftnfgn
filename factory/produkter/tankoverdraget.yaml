# Beskrivningens sju block, texterna ordagrant från källsidan på Bäverbutiken.
beskrivning:
  problem_rubrik: "Regnvattnet grönskar innan sommaren ens börjat"
  problem_text: "Solljus rakt in i tanken får alger att växa i vattnet, och UV-strålningen gör plasten spröd år för år. Presenningen som skulle skydda blåser av vid första höststormen."
  losning_rubrik: "Ett överdrag som håller ljuset ute och tanken hel"
  losning_text: "Trä överdraget över tanken och stäng dragkedjan – det gröna 210D-oxfordtyget stänger ute ljuset så algerna aldrig kommer igång, och tar solen i stället för plasten. Öppningen upptill gör att du kommer åt locket utan att ta av något, och måtten 120 × 100 × 116 cm passar en standardtank på 1000 liter."

vinkel:
  huvudvinkel: "Regnvattnet grönskar — solljus in i tanken ger alger, UV gör plasten spröd, presenningen blåser av (källa: bevisad produktsida på Bäverbutiken, samma copy; PD/SP/CS-vinklarna i NO-batchen 2026-08-29, BE-ROAS 1,63)"
  underrubrik: "Stänger ute ljuset så algerna aldrig kommer igång – och tar solen i stället för plasten. Passar 1000-liters IBC."
  # Kort produkt-USP (max ~25 tecken) — fjärde punkten i startsidans USP-rad
  # och annonsradens tredje text. Ur källsidans titel.
  usp: "Stoppar alger och UV"

malgrupp:
  beskrivning: "Villa-, fritidshus- och småbruksägare med en 1000-liters IBC-tank för regnvatten på tomten — vattnar odlingar, växthus eller djur ur den och är trötta på grönt vatten, spröd plast och presenningar som blåser av"

