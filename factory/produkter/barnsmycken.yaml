  - "Ett eget armband som växer fram till julafton, i stället för 24 lösryckta prylar"
  - "Två hängen klara att bära direkt: ett rosa hjärta och en enhörning med regnbågsman"
  - "Alla delar matchar varandra i rosa, lila och silverfärgat, oavsett i vilken ordning luckorna öppnas"

features:
