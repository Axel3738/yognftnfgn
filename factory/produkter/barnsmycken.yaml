faq:
  - fraga: "Vad finns bakom luckorna?"
    svar: "En smyckesdel bakom varje lucka – pärlor, berlocker, hängen eller en del av de två färdiga armbanden i silverfärgad metall. Exakt vilken del som ligger bakom vilken lucka är inte specificerat, men allt innehåll syns i produktbilderna."
  - fraga: "Vilket material är smyckena gjorda av?"
    svar: "Delarna är silverfärgade i metall, med pärlor och glittriga stenar i rosa och lila (murano-liknande). Vi kallar dem inte äkta silver eller äkta ädelstenar – det är inte belagt att det är det materialet."
  - fraga: "Vilken ålder passar kalendern för?"
    svar: "Ingen åldersgräns anges på förpackningen eller hos leverantören. Kalendern innehåller små delar som pärlor och berlocker, så var med om barnet är litet."
  - fraga: "Hur många delar ingår totalt?"
    svar: "Lådan har 24 numrerade luckor. I den syns två färdiga armband, två halsband med hänge och omkring tjugotre lösa berlocker och pärlor – vi anger inget exakt totalantal utöver det som går att se på bilderna."
  - fraga: "Hur lång är leveranstiden och kostar frakten något?"
    svar: "Leveranstiden är 5–10 arbetsdagar. Frakten är fri i Sverige och Norge."
  - fraga: "Vad gäller om jag vill ångra köpet?"
    svar: "Du har 14 dagars ångerrätt enligt svensk lag."

