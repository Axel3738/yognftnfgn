beskrivning:
  problem_rubrik: "Prylar som inte hör ihop"
  problem_text: "Varje lucka ger en ny liten sak. Hon tittar på den en stund, lägger den åt sidan, och nästa dag är det redan något annat. Vid jul ligger tjugofyra små saker huller om buller i en låda, och ingen av dem hör ihop med de andra."
  losning_rubrik: "Trärs på armbandet som redan ligger där"
  losning_text: "Bakom varje lucka ligger en pärla, ett hänge eller en berlock med brett hål. De trärs direkt på de två armbandskedjorna som redan ligger i lådan, så delarna sätter sig fast i stället för att bli liggande för sig själva. Två hängen är klara att bära direkt: ett rosa hjärta och en enhörning med regnbågsman."

