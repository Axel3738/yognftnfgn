beskrivning:
  problem_rubrik: "En flaska sprit passar inte till alla"
  problem_text: "Du ska ge julklapp till någon som gillar sprit, bar och whiskykvällar – en kollega, en pappa, en syssling. En riktig flaska känns ofta för dyr, för stor eller olämplig att ge bort på jobbet, och du vet inte alltid om personen kör bil i jul eller har slutat dricka. Det du letar efter är något som visar att du vet vad hen gillar, utan att gåvan blir alkohol."
  losning_rubrik: "Bar-känslan utan en droppe alkohol"
  losning_text: "Det här är en dekorask: 24 flaskformade delar i whisky-, konjak- och vodka/ginstil, utan etiketter och utan en droppe alkohol. Locket är tryckt med en julgran av spritflaskor och behöver ingen inslagning, så den är klar att lägga i famnen direkt. Eftersom det inte finns någon alkohol i lådan går den lika bra till kollegan, bilföraren eller den som inte dricker."

