faq:
  - fraga: "Innehåller adventskalendern alkohol?"
    svar: "Nej. De 24 delarna föreställer klassiska spritflaskor (whisky, konjak, vodka och gin) som dekor – det finns ingen dryck och ingen vätska i lådan."
  - fraga: "Vad är flaskorna gjorda av?"
    svar: "Det anger inte leverantören, så vi vill inte gissa på material. Det vi vet är att det är 24 flaskformade delar utan etiketter eller varumärken."
  - fraga: "Är luckorna numrerade 1–24?"
    svar: "Bilden vi utgår från visar ett slätt lock utan synliga siffror, så vi kan inte lova numrerade luckor. Du får 24 flaskformade delar i asken, en för varje dag fram till julafton."
  - fraga: "Kan jag ge den till någon som inte dricker, kör bil eller är gravid?"
    svar: "Ja. Eftersom kalendern inte innehåller någon alkohol passar den till vem som helst, oavsett om personen dricker eller inte."
  - fraga: "Hur lång är leveranstiden och kostar frakten något?"
    svar: "Leveranstiden är 5–10 arbetsdagar, och frakten är fri både i Sverige och Norge."
  - fraga: "Kan jag returnera kalendern om jag ångrar mig?"
    svar: "Ja, du har 14 dagars ångerrätt från att du får paketet."

