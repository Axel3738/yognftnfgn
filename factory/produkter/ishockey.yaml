  problem_rubrik: "Chokladkalendern säger ingenting om hockeyintresset"
  problem_text: "December är fullspäckad av matcher, men julafton känns ändå långt borta. En hockeyfantast som får en vanlig chokladkalender öppnar den på tio sekunder och slänger den – ingen koppling till det hen faktiskt sitter och kollar på varje kväll."
  losning_rubrik: "En kalender som är hockey rakt igenom"
  losning_text: "Asken är hockey utan kompromiss: isarena, strålkastare och korsade klubbor tryckt över hela framsidan, med 24 numrerade luckor som räknar ner till julafton. Bakom luckorna väntar ett sortiment av hockeyprylar och samlarfigurer i olika lagfärger – ingen choklad, inget som konkurrerar med adventsljusstaken om uppmärksamheten."

