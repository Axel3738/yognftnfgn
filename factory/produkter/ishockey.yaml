faq:
  - fraga: "Vad finns bakom luckorna?"
    svar: "Ett sortiment av hockeyprylar och samlarfigurer – till exempel minihockeyklubbor, nyckelringar och figurer med hockeyhjälm i olika lagfärger. Vi anger inte exakt vilket föremål som ligger bakom varje enskild lucka."
  - fraga: "Innehåller kalendern godis eller alkohol?"
    svar: "Nej. Kalendern är helt fri från både godis och alkohol – innehållet är hockeytillbehör och samlarfigurer, inget att äta eller dricka."
  - fraga: "Vilken ålder passar kalendern för?"
    svar: "Det står ingen åldersgräns på förpackningen. Innehållet är småprylar och samlarfigurer, så vi rekommenderar att en vuxen håller ett öga på det om det finns småsyskon i huset."
  - fraga: "Är figurerna licensierade lagprodukter?"
    svar: "Det framgår inte av förpackningen, så vi lovar ingen officiell lag- eller ligalicens – kalendern säljs som en hockeytemad julkalender, inte som märkesvaror."
  - fraga: "Hur lång är leveranstiden?"
    svar: "5–10 arbetsdagar, med fri frakt både i Sverige och Norge."
  - fraga: "Kan jag skicka tillbaka kalendern om den inte passar?"
    svar: "Ja, du har 14 dagars ångerrätt från att du fått paketet."

