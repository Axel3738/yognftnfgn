  underrubrik: "Fyra spön. Fyra platser. Slut på trasslet."

malgrupp:
  beskrivning: "Sport- och fritidsfiskare 30–65 som har fler spön än plats. Båtägare, stugägare och garagefiskare — de säger 'spö' och 'drag', inte 'fiskeutrustning', och de vet vad ett skeddrag är."

