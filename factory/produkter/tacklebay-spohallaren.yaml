beskrivning:
  problem_rubrik: "Femton minuter på en knut innan första kastet"
  problem_text: "Spöna har legat i en hög i garaget sedan sist. Linorna har hittat varandra, en krok sitter i fel spö, och nu står du på bryggan och petar i stället för att fiska."
  losning_rubrik: "Fyra spön, fyra platser"
  losning_text: "Fyra hållare skruvas upp på väggen eller i båten och tar ett spö var. Spöna står upp, linorna hänger fritt och ingenting hakar i något annat. Nästa gång lyfter du ner ett spö och går."

