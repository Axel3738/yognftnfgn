faq:
  - fraga: "Innehåller kalendern alkohol eller riktig öl?"
    svar: "Nej. De 24 flaskorna är miniatyrhängen i ölflaskform utan innehåll – ren dekoration till granen, ingen dryck och ingen alkohol i asken."
  - fraga: "Går flaskorna att öppna och fylla själv?"
    svar: "Det är inte bekräftat av leverantören. Flaskorna har kapsyl och ögla för upphängning, men räkna med dem som färdiga granhängen – inte som behållare att fylla."
  - fraga: "Är dagarna numrerade i asken, som i en vanlig adventskalender?"
    svar: "Vi kan inte se det i de bilder vi har, så vi lovar inga numrerade luckor. Du får 24 flaskhängen i en ask märkt för advent – ta fram en i taget i den takt som passar dig."
  - fraga: "Hur lång är leveranstiden?"
    svar: "5–10 arbetsdagar till både Sverige och Norge."
  - fraga: "Vad händer om jag ångrar mig?"
    svar: "Du har 14 dagars ångerrätt från att du tagit emot paketet, enligt svensk distansköpslag."
  - fraga: "Tillkommer fraktkostnad?"
    svar: "Nej, fri frakt till både Sverige och Norge."

