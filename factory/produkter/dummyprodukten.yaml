# DUMMYPRODUKT — exempel på en komplett ifylld produktfil.
# Används som facit i testerna. Ingen riktig produkt.
#
# Företagsuppgifter, valuta, frakt och returvillkor står INTE här.
# De bor i butikskonfigen (factory/butiker/<id>.yaml) och ärvs av varje produkt.

produkt:
  namn: "Nackmagneten"
  id: nackmagneten

brand:
  namn: "Nackmagneten"        # tomt = butikens brand används
  domanideer:
    - nackmagneten.se
    - nackmagnet.se
    - stelnacke.se

ekonomi:
  inkopskostnad: 87           # 4,9 EUR produkt + 2,3 EUR frakt + tull, per styck
  pris: 399
  jamforpris: 599             # valutan kommer ur butikskonfigen

varianter:
  - namn: "Grå"
    sku: "NM-GRA"
  - namn: "Svart"
    sku: "NM-SVART"

