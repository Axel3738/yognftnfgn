malgrupp:
  beskrivning: "En vuxen som köper adventskalender till ett barn 3–10 år — förälder eller mor-/farförälder, 28–65. Har haft chokladkalendrar och tröttnat på att inget finns kvar. Säger 'lucka', 'julkalender' och 'alternativ till godis', vill vara den som hittade något bättre."

