beskrivning:
  problem_rubrik: "Vad ger man den som redan har allt i fiskelådan?"
  problem_text: "Han har wobblers i tre storlekar, skeddrag han aldrig använder och en låda som inte går att stänga. En ny rulle är för dyrt att chansa på, och ett presentkort säger ”jag visste inte”. Så det blir strumpor. Igen."
  losning_rubrik: "Ett drag om dagen fram till jul"
  losning_text: "Bakom varje lucka sitter ett drag — en wobbler ena dagen, ett skeddrag nästa, en mjukbeteräka den tredje. Tjugofyra morgnar med något att vända på i handen och fundera över var det ska provas. Vid julafton är det en ny låda, byggd en lucka i taget."

vinkel:
  huvudvinkel: "Presentproblemet, inte fisket: köparen är den som ska GE bort kalendern och inte vet vad hon ska välja. Källa: källsidans egen ingress, som redan är skriven mot gåvogivaren och sålde produkten in i Bäverbutikens sortiment."
  underrubrik: "24 luckor. 24 drag. Slut på presentgissandet."

malgrupp:
  beskrivning: "Den som ska köpa julklapp till en fiskare — partner, barn eller förälder, 25–65. Hon vet att han fiskar men inte vad han saknar, och vill slippa välja fel märke eller storlek."

problem:
  - "Fiskaren i familjen har redan allt man kan komma på att köpa."
  - "Ett presentkort läses som att man inte orkade tänka."
  - "Man vet inte vilket märke, vilken storlek eller vilken vikt som är rätt."
  - "Det blir strumpor. Igen."

benefits:
  - "Något att öppna varje dag, inte bara den 24:e."
  - "Ingen behöver gissa storlek eller märke — dragen passar alla spön."
  - "Lådan är fylld till våren med drag som ska ut och provas."
  - "Presentproblemet är löst med ett köp."

