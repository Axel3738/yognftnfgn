faq:
  # Ingen storleksfråga — måtten är okända och påstås inte.
  - fraga: "Behöver kojan el?"
    svar: "Nej. Väggarna är isolerade och behåller värmen katten själv avger."
  - fraga: "Håller den värmen på vintern?"
    svar: "Kojan är isolerad och upphöjd från marken, så kylan från underlaget hålls borta. Värmen kommer från katten själv, ingen el behövs."
  - fraga: "Vad händer när det regnar?"
    svar: "Sadeltaket skjuter ut över ingången och leder bort vattnet, och fliken vid dörren bromsar draget."
  - fraga: "Hur förvarar jag den på sommaren?"
    svar: "Kojan är hopfällbar och tar liten plats i förrådet till nästa säsong."
  - fraga: "Vad gäller om jag ångrar mitt köp?"
    svar: "Du har 14 dagars ångerrätt enligt svensk lag. Mejla hello@catcabin.se."

