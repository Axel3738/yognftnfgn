# (leverantörens genomskärning + Bäverbutikens infografik): stativ i metall
# med fyra ben, sadeltak i Oxford-tyg som skjuter ut över den välvda ingången,
# flik i öppningen, isolerade väggar, lös liggmatta, hopfällbar, tre färger.
# Okänt och därför aldrig påstått: mått i cm, vikt, isoleringens material,
# temperaturklass, "vattentät", maxstorlek på katt.
#
# Copyn (svenska) skrevs 2026-09-11 av en subagent (sonnet) ur
# output/catcabin/BRAND.md + docs/copy-regler.md; vinkel, målgrupp och
# struktur är huvudsessionens.

