beskrivning:
  # problem_rubrik är ordagrant top spenderns vinkel (Utekattkoja_PD_2_H1).
  problem_rubrik: "Katten sover under bilen igen"
  problem_text: "Det regnar, och katten är inte i trädgården. Den ligger under bilen igen, den enda torra platsen den känner till."
  losning_rubrik: "Tak, väggar, en flik mot vinden"
  losning_text: "Kojan står upphöjd på fyra ben, med ett sadeltak som leder bort regnet och en flik vid dörren som håller ute draget. Väggarna är isolerade, så värmen katten själv ger stannar inne."

vinkel:
  # INTERNT — syns aldrig för kund. Källa: MagiBorsten-kampanjen
  # 120250147309170291 (16 annonser, 2 760 kr / 9 köp / ROAS 2,57 på två dygn,
  # avläst 2026-09-11). Utekattkoja_PD_2_H1 är top spender: 1 453 kr, 4 köp,
  # ROAS 2,17 mot BE 1,62 — den enda annonsen över 300 kr/3 köp och därmed
  # den enda som får dömas (CLAUDE.md regel 3). SP_3_H1: 524 kr / 2 köp /
  # ROAS 3,01 — lovande men under domgränsen.
  huvudvinkel: "Problemet först — katten sover under bilen, under altanen eller på en kall betongtrapp; kojan är kattens egen torra plats, upphöjd från marken och i lä. Källa: Utekattkoja_PD_2_H1 i MagiBorsten (1 453 kr, 4 köp, ROAS 2,17 mot BE 1,62, 2026-09-09–11)."
  underrubrik: "Upphöjd från marken, med tak, isolerade väggar och en flik för dörren"
  usp: "Ben, tak, isolerade väggar"

malgrupp:
  beskrivning: "Kattägare med utekatt och tomt — villa, radhus eller landet — 30–65 år, i Sverige och Norge. Ser katten smita in under altanen när det regnar eller ligga hoprullad på en kall betongtrapp, och står i köksfönstret på kvällen och undrar var den tog vägen. Säger 'utekatt', 'katten', 'kojan', 'under bilen'. Sekundärt: den som matar en hemlös katt som dyker upp i trädgården. Vill kunna se från fönstret att katten ligger torrt."

problem:
  - "Katten smiter in under bilen när det regnar"
  - "Kall betongtrappa i stället för en egen plats"
  - "Inget skydd mot vinden vid dörren"
  - "Du ser inte var katten är när kvällen blir kall"

benefits:
  - "Katten har en egen torr plats, inte bilen"
  - "Du ser kojan från köksfönstret och vet att katten är i lä"
  - "Värmen katten själv ger stannar inne i väggarna"
  - "Ingen el, ingen sladd ut till trädgården"
  - "Kojan fälls ihop och tar liten plats i förrådet på sommaren"

features:
  - "Stativ i metall med fyra ben, upphöjt från marken"
  - "Sadeltak i Oxford-tyg, vattnet rinner av"
  - "Flik vid ingången som bromsar draget"
  - "Isolerade väggar, ingen el eller värmare"
  - "Lös liggmatta som går att ta ut och skaka"
  - "Hopfällbar för förvaring"
  - "Tre färger: grå, gräsgrön och svart"

