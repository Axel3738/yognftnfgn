beskrivning:
  problem_rubrik: "Fel sort blir stående i skåpet"
  problem_text: "En riktig flaska kräver att du gissar rätt sort – rökig, torvig eller söt bourbon – och gissar du fel blir den stående oöppnad. Och en flaska med etikett och åldersgräns känns fel att skicka i posten till någon du inte kan legitimationskolla."
  losning_rubrik: "Ingen sort att välja fel på"
  losning_text: "Bakom var och en av kalenderns 24 luckor väntar en miniatyrflaska med tryckt whiskyetikett – utan innehåll, utan åldersgräns, bara dekor att hänga i granen efter december. Ingen gissning om rätt sort, för det finns ingen dryck att välja fel."

vinkel:
  huvudvinkel: "Dekorflaskor – ingen alkohol — ur verifierade fakta om varan, En adventskalenderlåda med 24 luckor där varje lucka innehåller en miniatyr-whiskyflaska i"
  underrubrik: "24 dekorflaskor bakom luckorna – ingen alkohol, bara julkänsla att hänga i granen."
  usp: "Dekorflaskor – ingen alkohol"

malgrupp:
  beskrivning: "Vuxna som vill ge en whiskyintresserad vuxen (man eller kvinna) en festlig, alkoholfri adventskalender – någon som uppskattar looket och nedräkningen, inte en flaska att dricka."

problem:
  - "Du vet inte om mottagaren dricker rökig, torvig eller söt whisky – fel gissning blir en flaska som aldrig öppnas."
  - "En riktig flaska kräver åldersgräns vid köp och går inte att skicka hur som helst i posten."
  - "De vanliga presenterna till någon whiskyintresserad (glas, kork, bok) känns redan givna."

benefits:
  - "Du slipper gissa vilken whisky mottagaren gillar – det finns ingen sort att välja fel"
  - "Räknar ner mot jul utan att fylla på med alkohol eller godis"
  - "Flaskorna går att spara och hänga i granen igen nästa jul"
  - "Går att skicka och ge bort utan åldersgräns, eftersom det inte är dryck"
  - "Färdig present direkt ur lådan – ingen inslagning behövs"

features:
  - "24 miniatyrflaskor i plast/harts, ca 5 x 2 cm, med tryckta whiskyetiketter"
  - "Hängögla/snöre på varje flaska – häng i granen eller ställ på hylla"
  - "Kalenderlåda 25 x 18 x 5 cm med 24 fack och grönt julmotiv"
  - "Ingen montering – klar att ge bort direkt ur lådan"
  - "Innehåller ingen alkohol"

