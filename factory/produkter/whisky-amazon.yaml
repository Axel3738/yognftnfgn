  - fraga: "Kan man öppna flaskorna?"
    svar: "Nej, de är massiva dekorobjekt utan lock eller innehåll att komma åt."
  - fraga: "Är flaskorna likadana i varje kalender och sitter de i nummerordning bakom luckorna?"
    svar: "Vi har inte fått bekräftat av leverantören exakt vilka 24 flaskor som ingår eller om luckorna är numrerade – vi uppdaterar sidan så fort vi vet mer."
  - fraga: "Hur lång är leveranstiden och vad kostar frakten?"
    svar: "5–10 arbetsdagar. Fri frakt till Sverige och Norge."
  - fraga: "Vad händer om jag ångrar mig?"
    svar: "Du har 14 dagars ångerrätt från att du fått kalendern, enligt svensk distansköpslag."
  - fraga: "Finns det en åldersgräns för att köpa eller skicka den?"
    svar: "Nej – eftersom kalendern inte innehåller alkohol gäller ingen åldersgräns vid köp eller leverans."

