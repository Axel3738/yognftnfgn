  problem_text: "Varje december är det samma visa: kalendern öppnas i farten, chokladen är uppäten innan skorna är på, och resten av dagen finns inget kvar att se fram emot. Ett barn som är helt inne i dinosaurier vill ha något konkret att öppna varje morgon — inte en bit choklad som försvinner på tio sekunder."
  losning_rubrik: "Fylld med 24 dinosaurier, en per dag"
  losning_text: "Den här kalendern kommer färdigfylld: 24 numrerade luckor, en liten dinosaurie bakom varje. Inget att handla till och inget att packa i förväg — öppna asken och första december är klar att börja. Figurerna ligger i slumpmässig ordning, så överraskningen håller i sig hela vägen till julafton."

