ekonomi:
  # Ur Axels quote 2026-09-05: 16,5 USD produkt + 10,8 USD frakt = 27,3 USD
  # exkl. skatt per styck. Omräknat med ECB-kursen 9,5513 (2026-09-04) = 261 kr.
  # Vid 2-pack: 49,2 USD totalt (≈235 kr/st), 3-pack: 72,3 USD (≈230 kr/st).
  inkopskostnad: 261
  pris: 799
  jamforpris: 1000

  # --- SKALNINGSEKONOMI (räknad från grunden, factory/ekonomi.mjs) ---
  # Läses av /skalningskungen: break-even styr KILL-beslut, target styr skalning.
  #
  # **Axels besked 2026-09-08: HeimGuard säljer UTAN moms.** Marginalen räknas
  # rakt på priset (butiker/hemvakten.yaml: moms_i_pris false).
  #
  # Räkningen, per order:
  #   intäkt 799  −  varukostnad 261
  #   = täckningsbidrag 538 kr som ska betala annonsen
  #   break-even-CPA  = 538 kr        break-even-ROAS = 799 / 538 = 1,49
  #   target (25 % nettomarginal = 199,75 kr vinst per order):
  #   target-CPA      = 338 kr        target-ROAS     = 799 / 338,25 = 2,36
  #
  # ⚠️ Talen är räknade för DEN HÄR butiken och råkar ligga nära
  # Bäverbutikens — de är ändå inte kopierade därifrån. Kopiera aldrig ett
  # break-even-tal mellan verksamheter: nästa produkt har annan COGS.
  #
  # ⚠️ INTE inräknat (ingen verifierad siffra finns): betalväxelavgift
  # (Shopify Payments/Klarna), returer, tull, appkostnader, och COGS för
  # gratisbonusen (varningsskyltarna) i paketen. Varje sådan post gör
  # break-even STRÄNGARE än talen ovan — de är ett tak, inte ett golv.
  aov_sek: 799
  aov_kalla: "Styckpriset. Butiken har ingen försäljningsdata 2026-09-08 — INGEN uppmätt AOV finns."
  # ⚠️ AOV:n kommer att bli högre än 799: 2-packet är förvalt. Räknat på
  # paketpriserna blir break-even-ROAS 1,54 (A 1 342 kr, 2 st à 235 kr) och
  # 1,64 (B 1 199 kr, samma varukostnad), alltså STRÄNGARE än talet nedan.
  # Första skalningsronden ska läsa verklig AOV och räkna om blocket.
  # ⚠️ Sätt då BÅDA fälten. Enbart aov_sek räcker inte: utan
  # varukostnad_per_order kan verktyget inte veta hur många varor en order
  # innehåller (paketen är rabatterade och bär en gratis bonus), och det
  # vägrar räkna hellre än att gissa för generöst. Facit:
  #   aov_sek: 1342  +  varukostnad_per_order: 470   → 1,54 / 872 kr   (A)
  #   aov_sek: 1199  +  varukostnad_per_order: 470   → 1,64 / 729 kr   (B)
  #   aov_sek: 1917  +  varukostnad_per_order: 690   → 1,56 / 1 227 kr (A 3-pack)
  break_even_roas: 1.49
  break_even_cpa_sek: 538
  target_roas: 2.36
  target_cpa_sek: 338

