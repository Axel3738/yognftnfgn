  losning_rubrik: "Två linser som ser allt – och följer det som rör sig"
  losning_text: "Kameran täcker 355° med panorering och zoom, och AI:n skiljer människor från grenar och katter. Rör sig någon på tomten följer kameran automatiskt – och mobilen säger till direkt."

