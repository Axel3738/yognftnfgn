offer:
  beskrivning: "579 kr i stället för 965 kr (spara 386 kr), fri frakt, 14 dagars ångerrätt och leverans på 5–10 arbetsdagar."
  # ⚠️⚠️ PAKETNIVÅERNA ÄR 1 / 2 / 3 I DEN BYGGDA BUTIKEN — INTE 1 / 2 / 4.
  # MÄTT 2026-09-13 i ms_paketniva-metaobjekten och i de fyra rabattkoderna.
  # Butiken byggdes alltså på paket.mjs standardsteg (NIVAER.a/b), inte på
  # Axels paketregel av 2026-09-10 (.claude/commands/ny-ops.md rad 107,
  # factory/PROCESS.md rad 149: "nivåerna är alltid 1 / 2 / 4").
  # Filen nedan beskriver VERKLIGHETEN, så inget körs sönder av misstag.
  # Vill Axel ha 1/2/4 blir toppnivån (källans procent behålls):
  #   A 4-pack: 4×579 × 0,80 = 1 853 kr, kod FJORD4A, belopp
  #             4×579 + 4×189 − 1853 = 1 219 kr, min 8 varor
  #   B 4-pack: 4×579 × 0,75 = 1 737 kr, kod FJORD4B, belopp
  #             2316 + 756 − 1737 = 1 335 kr, min 8 varor
  # Det kräver en ny paket.mjs-körning som skriver om metaobjekt OCH koder.
  bundle: "A (butikens standard): 1 st 579 kr (+ batterifrånskiljare 189 kr som tillval), 2-pack 984 kr FÖRVALD 'Mest populär' (−15 %, FJORD2A, 2 batterifrånskiljare gratis), 3-pack 1 390 kr 'Bäst pris' (−20 %, FJORD3A, 3 gratis). B (test): 1 st 579 kr, 2-pack 926 kr FÖRVALD (−20 %, FJORD2B, 2 gratis), 3-pack 1 303 kr (−25 %, FJORD3B, 3 gratis). A/B mäts med temats ms-ab, test 'paket'."
  paket:
    test: "paket"
    # Alla sex nivåerna MÄTTA ur metaobjekten. Rabattbeloppen kontrollräknade
    # mot de fyra live-koderna och stämmer på kronan:
    #   FJORD2A 552 = 2×579 + 2×189 − 984   (min 4 varor) ✅
    #   FJORD3A 914 = 3×579 + 3×189 − 1390  (min 6 varor) ✅
    #   FJORD2B 610 = 2×579 + 2×189 − 926   (min 4 varor) ✅
    #   FJORD3B 1001 = 3×579 + 3×189 − 1303 (min 6 varor) ✅
    # ⚠️ `kod:` står UTSKRIVET på varje nivå med flit. Koderna är byggda med
    # paketPrefix "FJORD" (paket.mjs rad 182: prefix + antal + variant), och
    # `meta.creative_prefix` nedan är INTE "Fjord". Utan de här raderna skulle
    # nästa paket.mjs-körning skapa nya koder och lämna de fyra live-koderna
    # bakom sig — sidan skulle lova ett paketpris kassan inte tar.
    nivaer:
      - variant: a
        antal: 1
        rubrik: "1 st"
        underrubrik: "Standard pris"
      - variant: a
        antal: 2
        rubrik: "2 st"
        pris: 984
        kod: "FJORD2A"
        bricka: "Mest populär"
        gratis_antal: 2
        gratis_text: "2 batterifrånskiljare på köpet"
        forvald: true
      - variant: a
        antal: 3
        rubrik: "3 st"
        pris: 1390
        kod: "FJORD3A"
        bricka: "Bäst pris"
        gratis_antal: 3
        gratis_text: "3 batterifrånskiljare på köpet"
      - variant: b
        antal: 1
        rubrik: "1 st"
        underrubrik: "Standard pris"
      - variant: b
        antal: 2
        rubrik: "2 st"
        pris: 926
        kod: "FJORD2B"
        bricka: "Mest populär"
        gratis_antal: 2
        gratis_text: "2 batterifrånskiljare på köpet"
        forvald: true
      - variant: b
