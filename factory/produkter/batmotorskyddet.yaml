# FjordCover — produkt 1: Båtmotorskydd 420D, heltäckande för utombordare.
# Källa: baverbutiken.se/products/batmotorskydd-420d-heltackande-for-utombordare
# Specs, pris, paketnivåer och recensioner lästa ur källan 2026-09-12.
# Bilderna är facit: brett rundat överstycke över kåpan, insvängd midja, två
# spännband, utskjutande fot över riggen. Nio storlekar i varianterna.
#
# Okänt och därför ALDRIG påstått: vikt, fodrets material, om skyddet är
# vattentätt (källan säger "håller väder och smuts ute" — inte tätt),
# UV-klass, om det tål transport med skyddet på, andra färger än svart.
# ⚠️ Storleksguiden listar sju rader (6–15 t.o.m. 175–225) medan butiken säljer
# nio storlekar — 0–5 och 250–350 har inga publicerade mått. Påstå inga.
#
# Copyn (svenska) skrevs 2026-09-12 av en subagent (sonnet) ur
# output/fjordcover/BRAND.md + docs/copy-regler.md (rådata i
# output/fjordcover/copy-sv.yaml); vinkel, målgrupp och struktur är
# huvudsessionens, liksom rättelserna som är kommenterade nedan.

