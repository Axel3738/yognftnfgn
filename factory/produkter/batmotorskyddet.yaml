faq:
  - fraga: "Vilken storlek passar min motor?"
    svar: "Mät omkretsen runt motorkåpan och höjden, och jämför med storleksguiden. Skyddet finns i nio storlekar, från 0–5 hk till 250–350 hk."
  - fraga: "Vilket material är skyddet gjort av?"
    svar: "420D Oxford-tyg."
  - fraga: "Hur lång är leveranstiden?"
    svar: "Räkna med 5 till 10 arbetsdagar från beställning."
  - fraga: "Vad gäller om jag vill ångra köpet?"
    svar: "Du har 14 dagars ångerrätt enligt svensk lag. Mejla hello@fjordcover.se."
  # Subagenten skrev "Många använder det ..." — struket av huvudsessionen:
  # ingen vet hur många, och siffror som inte går att belägga skrivs aldrig.
  - fraga: "Kan jag ha skyddet på mellan båtturer, inte bara vid uppläggning?"
    svar: "Ja. Skyddet går lika bra att ha på mellan turerna för att hålla motorn ren."

