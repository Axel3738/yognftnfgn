  # källkampanjen "Båtmotorskyddet 420D | BE ROAS 1.62 | Launch 2026-08-29"
  # (MagiBorsten 120250009325850291, avläst 2026-09-13) har 46 annonser,
  # 20 681 kr spend, 89 köp, ROAS 2,67, CPA 232 kr. Rangordnat på vinstbidrag
  # ((357 − CPA) × köp) vinner SOCIAL PROOF och PRIS, inte problemvinkeln:
  #   SP_1_H1  2 437 kr · 16 köp · CPA 152 · +3 275 kr
  #   CS_2_1   2 880 kr · 16 köp · CPA 180 · +2 832 kr
  #   BF_3_1   2 005 kr · 10 köp · CPA 201 · +1 565 kr
  #   PD_1_H3    970 kr ·  2 köp · CPA 485 · −256 kr   ← problemvinkeln taplar
  huvudvinkel: "Säsongen tar slut och motorn står kvar oskyddad — sex månader väder plus en blank motor som syns från vägen. Men det som faktiskt säljer är social proof och priset: källkampanjens två bästa annonser (SP_1_H1 och CS_2_1, 16 köp var, CPA 152 och 180 kr) är 'så många båtägare har redan bytt' och '40 % rabatt', medan den rena problemvinkeln PD_1_H3 går back. Källa: MagiBorsten-kampanj 120250009325850291, 46 annonser, 89 köp, avläst 2026-09-13."
  underrubrik: "Heltäckande 420D-skydd som går från kåpan ner över riggen och sitter kvar hela uppläggningen. Nio storlekar, 0–350 hk."
  usp: "Kåpa till rigg. 420D."

