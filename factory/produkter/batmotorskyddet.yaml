  # 120250009325850291 "Båtmotorskyddet 420D | BE ROAS 1.62 | Launch 2026-08-29"
  # (46 annonser, 20 078 kr / 83 köp, avläst 2026-09-12). Rangordnat på
  # vinstbidrag (BE-CPA 357 kr − CPA) × köp, inte på ROAS ensamt:
  #   SP_1_H1  2 410 kr / 16 köp / CPA 151 / ROAS 4,35 → ca 3 300 kr  ← vinnare
  #   CS_2_1   2 874 kr / 16 köp / CPA 180 / ROAS 3,43 → ca 2 830 kr
  #   BF_3_1   1 960 kr / 10 köp / CPA 196 / ROAS 3,05 → ca 1 610 kr
  #   SP_1_H3  4 919 kr / 16 köp / CPA 307 / ROAS 2,28 → ca 800 kr (top spender,
  #            benchmark — inte en kandidat att döma mot småannonser)
  # SP_1_H2 (1 116 kr, 2 köp, ROAS 0,83) har SAMMA copy som H1/H3 men ligger
  # under break-even — det är hooken som skiljer, inte texten.
  huvudvinkel: "Tillhörighet — det här är vad båtfolk gör med motorn på hösten; skyddet dras över hela motorn innan båten lämnas för säsongen. Källa: Batmotor_SP_1_H1 i MagiBorsten (2 410 kr, 16 köp, CPA 151 kr mot BE-CPA 357 kr, ROAS 4,35, avläst 2026-09-12)."
  underrubrik: "Dras över kåpa och rigg, spänns fast med en rem"
  usp: "Nio storlekar, 0–350 hk"

malgrupp:
  beskrivning: "Båtägare med utombordare i Sverige och Norge, 35–70 år. Har en jolle, styrpulpetbåt eller mindre fritidsbåt som tas upp på hösten och står på trailer, i sjöbod eller på uppställningsplats till våren. Många har inget garage — båten står ute, synlig från vägen. Säger 'uppläggning', 'vinterförvaring', 'torrsättning', 'riggen', 'kåpan', 'hk'. Sekundärt: den som har båten i sjön hela säsongen och vill hålla motorn ren mellan turerna."

