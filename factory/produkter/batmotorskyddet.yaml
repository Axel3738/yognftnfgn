beskrivning:
  problem_rubrik: "Den blanka motorn syns från vägen"
  # Subagenten skrev "tar sin tid på ytan" — omskrivet av huvudsessionen till
  # begriplig svenska.
  problem_text: "Båten står upplagd för säsongen, och motorn är fortfarande synlig och oskyddad. Sex månader med regn, snö och frost sätter spår."
  losning_rubrik: "Täck den, spänn fast, gå därifrån"
  losning_text: "Skyddet dras över hela motorn, från kåpan ner över riggen, och spänns fast med en rem runt midjan. Sen är det gjort för säsongen."

vinkel:
