beskrivning:
  # problem_rubrik bär top spenderns vinkel (Balteslipmaskin_PD_2).
  problem_rubrik: "Vinkeln glider för varje drag"
  problem_text: "Kniven ligger slö i lådan. Du har provat bryne, men handen tröttnar och vinkeln glider innan slipningen är klar – resultatet blir en rundad egg i stället för en vass."
  losning_rubrik: "15° sitter i maskinen, inte i handen"
  losning_text: "Bandet går i 15° bältesvinkel hela vägen. Du styr trycket, maskinen håller linjen, och eggen blir jämn från spets till klack."

vinkel:
  # INTERNT — syns aldrig för kund. Källa: MagiBorsten-kampanjen
  # 120249902177470291 "Bälteslipmaskinen | BE ROAS 1.73 | Launch 2026-08-21",
  # avläst 2026-09-12: 35 annonser, 29 108 kr spend, 65 köp.
  # Över domgränsen 300 kr / 3 köp (CLAUDE.md regel 3) ligger fem annonser, och
  # rangordnat på vinstbidrag ((BE-CPA − CPA) × köp med BE-CPA = 909 − 384 =
  # 525 kr) vinner PD stort:
  #   Balteslipmaskin_PD_2    10 640 kr / 22 köp / CPA 484 / ROAS 2,04 ⇒ +902 kr
  #   Balteslipmaskin_PD_3     4 458 kr / 12 köp / CPA 372 / ROAS 2,69 ⇒ +1 836 kr
  #   Balteslipmaskin_PD_2_1   2 470 kr /  7 köp / CPA 353 / ROAS 2,95 ⇒ +1 204 kr
  #   Balteslipmaskin_CS_2_1   4 571 kr / 10 köp / CPA 457 / ROAS 2,11 ⇒ +680 kr
  #   Balteslipmaskin_PD_1     2 222 kr /  6 köp / CPA 370 / ROAS 2,41 ⇒ +930 kr
  # Top spendern PD_2 är benchmark, inte en kandidat att döma mot småannonser.
  # Fyra av fem vinnare är PD ⇒ problem-direkt är den bevisade vinkeln.
  huvudvinkel: "Problemet först — att slipa för hand kräver samma vinkel varje drag, annars blir eggen rundad i stället för vass, så slipningen blir aldrig av. Maskinen bär vinkeln (15° bältesvinkel) i stället för handleden. Källa: Balteslipmaskin_PD_2 i MagiBorsten (10 640 kr, 22 köp, ROAS 2,04 mot BE 1,73, avläst 2026-09-12) plus PD_3, PD_2_1 och PD_1 över domgränsen."
  underrubrik: "Slipband, slipsten och polerskiva – vinkeln sitter i maskinen, inte i handen"
  usp: "15° bältesvinkel"

malgrupp:
  beskrivning: "Hobbyman med en bänk i garaget, källaren eller förrådet — 30–65 år, Sverige och Norge. Har knivar som ska vara vassa: kökskniv, jaktkniv, fiskekniv, täljkniv, yxa. Kanske täljer, kanske bygger, kanske fixar. Har provat att slipa för hand med bryne eller sten och tycker att resultatet blev ojämnt. Säger 'egg', 'bryne', 'slipvinkel', 'slö', 'vass', 'bänken', 'slipband' — aldrig 'verktygsmaskin' eller 'professionell'. Sekundärt: den som polerar smycken eller metalldetaljer."

problem:
  - "Kniven ligger slö i lådan för att slipningen aldrig blir av"
  - "Handen orkar inte hålla samma vinkel hela vägen genom slipningen"
  - "Fel vinkel gör eggen rund i stället för vass"
  - "En slö kniv river i stället för att skära rent"

benefits:
  - "Bandet går i 15° – du slipper hålla vinkeln i handleden"
  - "Från slö till vass utan att gissa på gradantalet"
  - "Samma maskin slipar, polerar och formar – en apparat på bänken i stället för tre verktyg"
  - "Jämn egg genom hela bladet, från spets till klack"
  - "Redo direkt – band, sten, polerskiva och tillbehör ligger i lådan"

