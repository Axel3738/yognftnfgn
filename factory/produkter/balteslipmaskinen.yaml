# EdgeBench — produkt 1: Mini bälteslipmaskin 3-i-1.
# Källa: baverbutiken.se/products/balteslipmaskin-mini-3-i-1-knivslip-polerare
# Pris, paketnivåer, recensioner och annonsdata lästa ur källan 2026-09-12.
#
# BILDEN ÄR FACIT (factory/output/balteslipmaskinen/kalla-produkt.json + den
# enda produktbilden): svart bottenplatta i metall med fyra gummifötter, motor
# som driver ett slipband över två rullar med spännfjäder, slipsten på vänstra
# axeländen, polerskiva i bomull på den högra. Medföljer enligt bilden: två
# insexnycklar, ca 10 extra slipband, ca 10 sliprondeller, ett block grön
# polerpasta, nätadapter med sladd och ett gult plastskydd.
# ⇒ "3-i-1" = slipband + slipsten + polerskiva. Maskinen går på NÄTADAPTER.
#
# Okänt och därför aldrig påstått: mått, vikt, effekt i watt, varvtal, bandets
# mått, vad det gula plastskyddet är för, maxstorlek på kniv, om vinkeln går
# att ändra. Källan säger "7 hastigheter" och "15° bältesvinkel" — de två talen
# står i källans egen beskrivning och tas med, men syns inte i bilden.
#
# Copyn (svenska) skrevs 2026-09-12 av en subagent (sonnet) ur
# output/edgebench/BRAND.md + docs/copy-regler.md (underlaget och
# tre-frågorstestet: output/edgebench/COPY-SV.md). Vinkel, målgrupp och
# struktur är huvudsessionens, liksom rättelserna: "sliper" → "slipar", varje
# "fast inställd 15°" struken (källan säger aldrig att vinkeln är låst), och
# "skyddshölje" → "gult plastskydd".

