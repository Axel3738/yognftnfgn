offer:
  beskrivning: "909 kr i stället för 1 182 kr. Två stycken ger 17 % rabatt, tre stycken 21 %. Fri frakt till Sverige och Norge, 14 dagars ångerrätt enligt svensk lag och leverans på 5 till 10 arbetsdagar."
  bundle: "2-pack – 17 % rabatt (förvald, 'Mest populär'). 3-pack – 21 % rabatt ('Bäst pris'). Exakt källans Kaching-nivåer, se output/balteslipmaskinen/kalla-kaching-paket.json."
  # A = källans EGNA Kaching-nivåer. De skiljer sig från fabrikens standard-A
  # (15/20 %), så nivåerna står uttryckligen här — 17 och 21 är källans tal.
  # B = testoffret, ett steg djupare. Förvald nivå är mitten (⌈n/2⌉), vilket
  # också är den källan har förvald (preselectedDealBarId = 2x-nivån).
  # Hela procenttal utan gratisrad ⇒ paket.mjs skriver PROCENTkoder, så sidan
  # och kassan visar samma tal i varje valuta (PROCESS.md fas 4 punkt 17).
  paket:
    test: "paket"
    nivaer:
      - variant: a
        antal: 1
        rubrik: "1 st"
        underrubrik: "Ordinarie pris"
      - variant: a
        antal: 2
        rubrik: "2 st"
        rabatt: 0.17
        bricka: "Mest populär"
      - variant: a
        antal: 3
        rubrik: "3 st"
        rabatt: 0.21
        bricka: "Bäst pris"
      - variant: b
        antal: 1
        rubrik: "1 st"
        underrubrik: "Ordinarie pris"
      - variant: b
        antal: 2
        rubrik: "2 st"
        rabatt: 0.22
        bricka: "Mest populär"
      - variant: b
        antal: 3
        rubrik: "3 st"
        rabatt: 0.26
        bricka: "Bäst pris"
  # Q4-ramverket (CLAUDE.md): en billig komplementprodukt i två roller.
  # ⚠️ BARA rollen "betald upsell i varukorgen" + fullpris-kryssrutan på nivå 1
  # är byggd. Gratis bonus i paketnivåerna är INTE lagd, och det är ett
  # medvetet val som Axel ska få säga ja eller nej till:
  #   • Källans Kaching-nivåer ger redan 17 och 21 % rabatt. Q4-ramverkets
  #     poäng är att byta DJUPARE rabatt mot mer värde — här skulle gratis
  #     bonus komma OVANPÅ rabatten, inte i stället för den.
  #   • Antalsregeln (Axel 2026-09-08) säger gratis_antal = paketantalet, så
  #     ett 2-pack skulle ge bort två kedjeslipar. Inköpet är okänt men ligger
  #     på samma Temu-led ⇒ uppskattningsvis ~25–30 % av 2-packets marginal.
  #   • En gratisrad gör dessutom rabattkoden till ett BELOPP i stället för en
  #     procent, och då stämmer inte paketpriset i NOK när Norge får egen
  #     valuta (PROCESS.md fas 4 punkt 17).
  # Ändrad rabatt är ägarens beslut (CLAUDE.md regel 12) — säger Axel ja
  # räcker det att sätta gratis_antal på nivåerna och köra `--igen paket`.
  bonus_produkt:
    titel: "Kedjeslip – Handdriven, Redo för Skogen & Stugan"
    handle: "kedjeslipen"
    produkt_id: "10400050610471"
    variant_id: "52061504831783"
    pris: 249
    i_paket: "Ingen gratisnivå — säljs som betald tilläggsprodukt i varukorgen och som fullpris-kryssruta på 1 st."
    tillagg_kryssruta: true
    kortnamn: "kedjeslipen"
    sku: "TEMU-601101152010798"
    bilder:
      - "https://cdn.shopify.com/s/files/1/1013/0322/2621/files/c037b5a5-5001-4da8-92a2-388f9cb061da.jpg"
      - "https://cdn.shopify.com/s/files/1/1013/0322/2621/files/cc233bef-1f1a-44ff-bde6-fdf304b8b202.jpg"
      - "https://cdn.shopify.com/s/files/1/1013/0322/2621/files/a450d36f-0bfe-47c9-8082-c4c54a46bcf4.jpg"
      - "https://cdn.shopify.com/s/files/1/1013/0322/2621/files/76588bfe-aac9-44a0-b898-aa925ff84440.jpg"
      - "https://cdn.shopify.com/s/files/1/1013/0322/2621/files/8402e5b7-2dab-4605-b8ef-0dbcc9782e00.jpg"
    # Bonusens copy skrevs 2026-09-12 av en subagent (sonnet), underlag i
    # output/edgebench/COPY-BONUS-SV.md. ⚠️ Huvudsessionen rättade "sliper"
    # → "slipar" — felet står så på KÄLLANS egen sida, men det är norska.
    problem_rubrik: "Slö Kedja Sliter på Såg och Armar"
    problem_text: "En slö sågkedja gör sågningen trög och sliter på både motorsågen och armarna. Resultatet blir oförutsägbart – du vet aldrig hur snittet blir."
    losning_rubrik: "Vässa Kedjan för Hand, Utan El"
    losning_text: "Kedjeslipen slipar sågkedjan snabbt och jämnt, helt utan el. Liten nog att få plats i väskan till skogen eller stugan."
