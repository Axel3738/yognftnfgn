faq:
  # Ingen storleks- eller viktfråga — måtten är okända och påstås inte.
  - fraga: "Vad kan jag slipa och polera?"
    svar: "Knivar, trä, metall och smycken. Bandet slipar, stenen tar det grova och polerskivan ger ytan tillbaka."
  - fraga: "Behöver den batteri?"
    svar: "Nej. Den drivs via medföljande nätadapter med sladd."
  - fraga: "Vad ingår i paketet?"
    svar: "Maskinen med slipband, slipsten och polerskiva, plus två insexnycklar, cirka tio extra slipband, cirka tio sliprondeller, ett block grön polerpasta, nätadapter med sladd och ett gult plastskydd."
  - fraga: "Hur lång är leveranstiden?"
    svar: "5 till 10 arbetsdagar till Sverige och Norge, med fri frakt."
  - fraga: "Kan jag ångra köpet?"
    svar: "Ja, du har 14 dagars ångerrätt enligt svensk lag. Mejla hello@edgebench.se så hjälper vi dig."

