# TANKGUARD — OPS-butik nr 2 (IBC-tanköverdrag).
#
# ⚠️ DEN HÄR FILEN ÄR INTE KOMPLETT ÄNNU. Den skapades 2026-09-08 för Uppdrag A
# i factory/FAS2.md (brand-detektorn), som behöver källkopplingen nedan för att
# veta vilka av Bäverbutikens annonser som hör till butiken. Butiksbygget gjordes
# utanför repot och lämnade aldrig efter sig någon produktfil.
#
# Ifyllt och verifierat 2026-09-08: produkt, ekonomi (priser ur källsidans
# products/<handle>.json, inköp ur Axels COGS-doc batch #4), kalla-blocket
# (ur MagiBorsten 1867947880635861), meta.
# Påfyllt 2026-09-08 kväll av /ny-annonser: den NORSKA källkopplingen,
# priserna i materialet per marknad, och meta.page_id + meta.pixel_id
# verifierade mot Meta (inte kopierade ur en text). Även kampanjskalet som
# redan står i målkontot, så nästa körning fyller det i stället för att bygga
# ett nytt bredvid.
# ⛔ ANNONSFASEN ÄR BLOCKERAD: `factory/butiker/tankguard.yaml` finns inte på
# någon gren. Utan den saknas produktlänk, SEK-pris, NOK-pris och villkor —
# och inget av dem får gissas. Läget: factory/output/tankguard/kallannonser.md
# SAKNAS och fylls av /ny-ops-körningen som dokumenterar butiken:
# varianter, media, beskrivning, vinkel, malgrupp, problem, benefits, features,
# offer (paketnivåer + Q4-bonus), reviews, faq, leveranstid, garantier,
# leverantor, ekonomi.valuta, brand.domanideer — och butikens EGET pris, som
# break-even måste räknas om på. Hitta inte på dem; hämta dem ur källan.

produkt:
  namn: "IBC-tanköverdrag 1000 L – Stoppar Alger & UV"
  id: tankguard

brand:
  namn: "TankGuard"

ekonomi:
  # Källbutikens priser 2026-09-08 (baverbutiken.se). OPS-butikens egna priser
  # sätts i butiksbygget — kopiera dem inte härifrån utan att räkna om.
  pris: 489
  jamforpris: 636
  # Inköp per styck, 1 st till Sverige, exkl. skatt.
  # Källa: Axels COGS-doc 1BtFJj1A3J2ciZZS…, batch-sheet #4, raden
  # "Water tank cover", SWEDEN: 5,73 produkt + 8,21 frakt = 13,94 EUR.
  # (Enheten är EUR — samma rads NORWAY-kolumn, 15,63, är exakt talet
  # no-ibc-video.config.mjs räknade BE-ROAS 1,63 på "à 10,86".)
  # Omräknat med ECB-kursen 11,152 EUR/SEK (2026-09-08) = 155,46 kr.
  inkopskostnad: 155
  # Rabattrappan i samma rad, omräknad per styck: 2-pack 23,65 EUR = 132 kr/st,
  # 3-pack 33,35 EUR = 124 kr/st. Flerpack sänker alltså inköpet 15–20 %.
  # Referens vid KÄLLBUTIKENS pris 489 kr utan moms: täckningsbidrag 334 kr,
  # break-even-ROAS 1,46, break-even-CPA 334 kr. SE-kampanjen heter "BE ROAS
  # 1.51" — den räknades på en äldre kurs.
  # ⚠️ Detta är INTE TankGuards break-even. Butiken har inget eget pris satt i
  # repot och `factory/butiker/tankguard.yaml` finns inte, så momsfrågan är
  # oavgjord. Räkna om från grunden när priset är spikat — kopiera aldrig
  # break-even-tal mellan verksamheterna (FAS2, Uppdrag E).
  #
  # TANKGUARDS EGET PRIS är 489 kr (Axels skärmbild 2026-09-08, se offer: nedan)
  # — alltså samma tal som källbutiken, men UTAN jämförpris och UTAN rabatt.
  # Break-even hänger helt på momsfrågan, och den kan bara butiksfilen svara på:
  #   utan moms i priset:  TB 489 − 155 = 334 kr → BE-ROAS 1,46 · BE-CPA 334 kr
  #   med moms i priset:   netto 391 − 155 = 236 kr → BE-ROAS 2,07 · BE-CPA 236 kr
  # Bäverbutiken säljer UTAN moms (CLAUDE.md), men `factory/butiker/hemvakten.yaml`
  # sätter `moms_i_pris: true` på OPS-butikerna. De två svaren skiljer 42 % — döm
  # ingen annons förrän frågan är avgjord.
  # ⚠️ Kampanjen i målkontot heter "BE-ROAS 1,62". Det talet stämmer med INGENDERA
  # uträkningen och ska inte litas på. Döp om kampanjen när svaret finns.
  # ⚠️ AOV blir dessutom högre än 489 kr så fort någon tar 2- eller 3-paketet,
  # och gratisbonusen (Kranskydd Frost, 199 kr/st inköp okänt) drar åt andra
  # hållet. Räkna på verklig AOV ur Shopify när ordrar finns — inte på 489.

