beskrivning:
  problem_rubrik: "Regnvattnet grönskar innan sommaren ens börjat"
  problem_text: "Solljus rakt in i tanken får alger att växa i vattnet, och UV-strålningen gör plasten spröd år för år. Presenningen som skulle skydda blåser av vid första höststormen."
  losning_rubrik: "Ett överdrag som håller ljuset ute och tanken hel"
  losning_text: "Trä överdraget över tanken och stäng dragkedjan – det gröna 210D-oxfordtyget stänger ute ljuset så algerna aldrig kommer igång, och tar solen i stället för plasten. Öppningen upptill gör att du kommer åt locket utan att ta av något, och måtten 120 × 100 × 116 cm passar en standardtank på 1000 liter."

vinkel:
  huvudvinkel: "Ljuset är orsaken, inte vattnet — stäng ute ljuset så kommer algerna aldrig igång (källa: källsidans egen vinkel, som bar SE-kampanjen sedan 2026-08-28)"
  underrubrik: "Stänger ute ljuset så algerna aldrig kommer igång – och tar solen i stället för plasten. Passar 1000-liters IBC."

malgrupp:
  beskrivning: "Villa-, fritidshus- och kolonilottsägare 35–70 som samlar regnvatten i en IBC-tank till trädgården. Pratar om tanken, vattnet och säsongen — inte om produkter. Vet redan att vattnet blir grönt; vet inte att det är ljuset som gör det."

problem:
  - "Vattnet blir grönt av alger redan tidigt på säsongen"
  - "UV-strålningen gör tankens plast spröd år för år"
  - "Presenningen som skulle skydda blåser av vid första höststormen"
  - "Går inte att komma åt locket utan att lyfta av hela skyddet"

benefits:
  - "Vattnet håller sig klart – tyget stänger ute ljuset som får alger att växa"
  - "Tanken åldras inte i solen – 210D oxfordtyg tar UV-strålningen i stället för plasten"
  - "Locket alltid åtkomligt – öppning upptill, fyll på utan att ta av överdraget"
  - "På och av med dragkedja – ingen kamp med presenning och gummiband"
  - "Passar standardtanken – 120 × 100 × 116 cm för 1000-liters IBC"

features:
  - "Grönt 210D oxfordtyg som stänger ute ljus och UV"
  - "Dragkedja längs sidan – på och av utan verktyg"
  - "Öppning upptill så locket alltid går att nå"
  - "Mått 120 × 100 × 116 cm, för 1000-liters IBC-tank"
  - "Dragsnören nertill som håller överdraget på plats"

offer:
  beskrivning: "Paketnivåer 1/2/3 överdrag med fast pris via riktig rabattkod. Mitten (2-pack) är förvald enligt Axels regel — position ⌈n/2⌉, aldrig första."
  bundle: "A: 2-pack 831 kr (PAKET2), 3-pack 1159 kr (PAKET3). B: 2-pack 799 kr (PAKET2B), 3-pack 1099 kr (PAKET3B). A/B mäts med temats ms-ab, test 'paket'."
  # Q4-RAMVERKET — gratis i paketen + betald upsell i korgen.
  # Antalsregeln (Axel 2026-09-08): gratis-antalet följer paketantalet.
  # Avläst i butiken 2026-09-09: 2-pack ger 2 st, 3-pack ger 3 st.
