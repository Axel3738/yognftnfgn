  # SAMMA priser — avläst i butiken 2026-09-09: 489 kr, jämförpris 636 kr.
  pris: 489
  jamforpris: 636
  # Inköp per styck, 1 st till Sverige, exkl. skatt.
  # Källa: Axels COGS-doc 1BtFJj1A3J2ciZZS…, batch-sheet #4, raden
  # "Water tank cover", SWEDEN: 5,73 produkt + 8,21 frakt = 13,94 EUR.
  # (Enheten är EUR — samma rads NORWAY-kolumn, 15,63, är exakt talet
  # no-ibc-video.config.mjs räknade BE-ROAS 1,63 på "à 10,86".)
  # Omräknat med ECB-kursen 11,152 EUR/SEK (2026-09-08) = 155,46 kr.
  inkopskostnad: 155
  # Rabattrappan i samma rad, omräknad per styck: 2-pack 23,65 EUR = 132 kr/st,
  # 3-pack 33,35 EUR = 124 kr/st. Flerpack sänker alltså inköpet 15–20 %.

# BREAK-EVEN — den frågan som stod öppen i den här filen till 2026-09-09.
# Den gamla noteringen sa "momsfrågan är oavgjord, räkna om från grunden".
# Avgjord nu, på två oberoende avläsningar:
#   1. Butiken själv: shop.taxesIncluded = true och alla varianter taxable
#      = true (avläst 2026-09-09). OPS-butikerna säljer alltså MED moms.
#   2. HeimGuard som facit: dess live-kampanj heter "BE-ROAS 2,11" och
#      799 kr / 261 kr i inköp ger exakt 2,11 FÖRST när 25 % moms dras av
#      (799/1,25 = 639,20 → TB 378,20 → 799/378,20 = 2,11). Utan moms-
#      avdrag blir samma tal 1,49. Metoden är alltså bevisad, inte gissad.
# ⚠️ Det här skiljer OPS-butikerna från Bäverbutiken, som säljer UTAN moms
# (Axels besked 2026-08-29). Kopiera aldrig break-even mellan dem.
#   489 / 1,25 = 391,20 netto − 155 inköp = 236,20 i täckningsbidrag
break_even_roas: 2.07
break_even_cpa_sek: 236

