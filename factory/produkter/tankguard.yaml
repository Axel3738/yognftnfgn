# TANKGUARD — OPS-butik nr 2 (IBC-tanköverdrag). tankguard.se
# Butikens produkt: handle `tankoverdraget`, id 15989715108184 (ACTIVE).
#
# HISTORIK — tre filer för samma produkt fanns till 2026-09-09:
#   • tankguard.yaml (Uppdrag A 2026-09-08, bara källkopplingen)
#   • tankoverdraget.yaml (/ny-ops 2026-09-08 — filen butiken BYGGDES av:
#     paket, bonus, recensioner med datum, [SV]/[NO]-bilder)
#   • tankguard.yaml igen (/ny-ops-avläsning 2026-09-09 mot den LIVE butiken:
#     break-even, vinklar, Meta-id:n)
# Förenade 2026-09-09 (KEDJAN.md) till den här enda filen. Filens id är
# `tankguard` (statens och outputmappens namn); butikens handle står i
# produkt.handle, eftersom produkten redan ligger under /products/tankoverdraget.
# Där versionerna sa olika saker vann den senast AVLÄSTA (09-09) — och där
# ingen avläsning finns står det som en öppen fråga, inte som ett val.

produkt:
  namn: "IBC-tanköverdrag 1000 L – Stoppar Alger & UV"
  id: tankguard
  # Butikens handle skiljer sig från filens id — se historiken ovan.
  handle: tankoverdraget

brand:
  namn: "TankGuard"
  # tankguard.se köptes och är primär domän i butiken sedan 2026-09-08.
  # tankguard.no svarade "not registered" i Norids RDAP samma dag (ledig).
  domanideer:
    - "tankguard.se"
    - "tankguard.no"

ekonomi:
  # Källbutikens priser 2026-09-08 (baverbutiken.se). OPS-butiken satte
  # SAMMA priser — avläst i butiken 2026-09-09: 489 kr, jämförpris 636 kr.
  pris: 489
  jamforpris: 636
  # INKÖP PER STYCK — ⚠️ ÖPPEN FRÅGA, två tal i omlopp:
  #   155 kr (avläst 2026-09-09): Axels COGS-doc 1BtFJj1A3J2ciZZS…, batch-
  #     sheet #4, raden "Water tank cover", SWEDEN: 5,73 produkt + 8,21 frakt
  #     = 13,94 EUR × ECB 11,152 (2026-09-08) = 155,46 kr. UTAN tull.
  #   188 kr (2026-09-08, filen butiken byggdes av): samma 13,94 EUR + 2,9 EUR
  #     tull = 16,84 EUR × ECB 11,162 (2026-09-07) = 188 kr. MED tull.
  # Skillnaden är alltså tullposten (≈32 kr), inte två olika mätningar av
  # produkten. Vilket som gäller beror på om tull faktiskt tas ut på Temu-
  # leveransen — det har ingen session kontrollerat mot en riktig faktura.
  # Här står det senast mätta talet (155). Break-even nedan är räknat på det;
  # med 188 blir TB 203 kr och BE-ROAS 2,41. Fråga Axel innan ett kill-beslut
  # mäts mot 2,07.
  # Rabattrappan i samma rad, per styck utan tull: 2-pack 23,65 EUR = 132 kr,
  # 3-pack 33,35 EUR = 124 kr. Flerpack sänker alltså inköpet 15–20 %.
  inkopskostnad: 155

# BREAK-EVEN — avgjort 2026-09-09 på två oberoende avläsningar:
#   1. Butiken själv: shop.taxesIncluded = true och alla varianter taxable
#      = true (avläst 2026-09-09). OPS-butikerna säljer alltså MED moms.
#   2. HeimGuard som facit: dess live-kampanj heter "BE-ROAS 2,11" och
#      799 kr / 261 kr i inköp ger exakt 2,11 FÖRST när 25 % moms dras av
#      (799/1,25 = 639,20 → TB 378,20 → 799/378,20 = 2,11). Utan moms-
#      avdrag blir samma tal 1,49. Metoden är alltså bevisad, inte gissad.
# ⚠️ Det här skiljer OPS-butikerna från Bäverbutiken, som säljer UTAN moms
# (Axels besked 2026-08-29). Kopiera aldrig break-even mellan dem.
#   489 / 1,25 = 391,20 netto − 155 inköp = 236,20 i täckningsbidrag
# (Räknat på 155 kr — se öppna frågan om inköpet ovan.)
break_even_roas: 2.07
break_even_cpa_sek: 236

