# TANKGUARD — OPS-butik nr 2 (IBC-tanköverdrag).
#
# ⚠️ DEN HÄR FILEN ÄR INTE KOMPLETT ÄNNU. Den skapades 2026-09-08 för Uppdrag A
# i factory/FAS2.md (brand-detektorn), som behöver källkopplingen nedan för att
# veta vilka av Bäverbutikens annonser som hör till butiken. Butiksbygget gjordes
# utanför repot och lämnade aldrig efter sig någon produktfil.
#
# Ifyllt och verifierat 2026-09-08: produkt, ekonomi (priser ur källsidans
# products/<handle>.json, inköp ur Axels COGS-doc batch #4), kalla-blocket
# (ur MagiBorsten 1867947880635861), meta.
# SAKNAS och fylls av /ny-ops-körningen som dokumenterar butiken:
# varianter, media, beskrivning, vinkel, malgrupp, problem, benefits, features,
# offer (paketnivåer + Q4-bonus), reviews, faq, leveranstid, garantier,
# leverantor, ekonomi.valuta, brand.domanideer — och butikens EGET pris, som
# break-even måste räknas om på. Hitta inte på dem; hämta dem ur källan.

produkt:
  namn: "IBC-tanköverdrag 1000 L – Stoppar Alger & UV"
  id: tankguard

brand:
  namn: "TankGuard"

ekonomi:
  # Källbutikens priser 2026-09-08 (baverbutiken.se). OPS-butikens egna priser
  # sätts i butiksbygget — kopiera dem inte härifrån utan att räkna om.
  pris: 489
  jamforpris: 636
  # Inköp per styck, 1 st till Sverige, exkl. skatt.
  # Källa: Axels COGS-doc 1BtFJj1A3J2ciZZS…, batch-sheet #4, raden
  # "Water tank cover", SWEDEN: 5,73 produkt + 8,21 frakt = 13,94 EUR.
  # (Enheten är EUR — samma rads NORWAY-kolumn, 15,63, är exakt talet
  # no-ibc-video.config.mjs räknade BE-ROAS 1,63 på "à 10,86".)
  # Omräknat med ECB-kursen 11,152 EUR/SEK (2026-09-08) = 155,46 kr.
  inkopskostnad: 155
  # Rabattrappan i samma rad, omräknad per styck: 2-pack 23,65 EUR = 132 kr/st,
  # 3-pack 33,35 EUR = 124 kr/st. Flerpack sänker alltså inköpet 15–20 %.
  # Referens vid KÄLLBUTIKENS pris 489 kr utan moms: täckningsbidrag 334 kr,
  # break-even-ROAS 1,46, break-even-CPA 334 kr. SE-kampanjen heter "BE ROAS
  # 1.51" — den räknades på en äldre kurs.
  # ⚠️ Detta är INTE TankGuards break-even — det är källbutikens.
  #
  # MOMSFRÅGAN ÄR AVGJORD 2026-09-09: ingen moms. Verksamheten säljer DDP
  # (Axels besked), så marginalen räknas rakt på priset, precis som
  # Bäverbutiken. Den gamla raden om att frågan var "oavgjord" är struken.
  #
  # 🖐 DET SOM SAKNAS ÄR ETT ENDA TAL: TankGuards EGET pris.
  # Butiken har inget pris satt i repot och `factory/butiker/tankguard.yaml`
  # finns inte. Utan priset går break-even inte att räkna, och utan break-even
  # kan Skalningskungen varken rangordna eller döma butikens annonser
  # (SKALNINGSKUNGEN.md, "Vad som måste finnas innan bygget").
  #
  # NÄR PRISET FINNS, räkna med husets formel — samma som HeimGuard fick
  # 2026-09-09 i produkter/overvakningskameran.yaml:
  #   täckningsbidrag = pris − 155
  #   break_even_roas = pris / täckningsbidrag
  #   break_even_cpa  = täckningsbidrag
  #   target_cpa      = täckningsbidrag − 0,25 × pris
  #   target_roas     = pris / target_cpa
  # Skriv sedan in break_even_roas, break_even_cpa_sek, target_roas,
  # target_cpa_sek och aov_sek här, med källa och datum.
  # Kopiera aldrig ett break-even-tal mellan verksamheterna (FAS2, Uppdrag E).

# KÄLLKOPPLINGEN — vilken Bäverbutiks-produkt och vilka Bäverbutiks-annonser
