    titel: "Kranskydd Frost 420D – Skyddar Utekranen i Vinter"
    handle: "kranskydd-frost"
    pris: 199
    i_paket: "2-pack ger 2 st gratis, 3-pack ger 3 st gratis. Nivå 1 får den som betald kryssruta till fullpris."

