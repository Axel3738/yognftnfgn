# Historik: filen skapades 2026-09-08 för Uppdrag A i factory/FAS2.md
# (brand-detektorn) med bara källkopplingen ifylld — butiksbygget gjordes
# utanför repot och lämnade ingen produktfil efter sig.
#
# KOMPLETTERAD 2026-09-09 av en /ny-ops-körning mot den färdiga butiken.
# Allt nytt här är AVLÄST ur den live butiken via Admin-API:t (produkt,
# varianter, media, opf-metafälten, paketnivåerna, fraktprofilen) eller ur
# källsidans products.json. Ingenting är påhittat. Där ett fält fortfarande
# är tomt står det varför.

