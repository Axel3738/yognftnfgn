faq:
  - fraga: "Vad finns bakom luckorna?"
    svar: "Ett modesmycke bakom varje lucka – halsband, örhängen och ringar blandat, i guld- och roséguldton med enstaka silverfärgade. Berlockerna har olika motiv, bland annat fjäril, fågel, snäcka, kors, lotus och krona. Exakt hur många av varje typ som ingår varierar."
  - fraga: "Är smyckena i äkta guld eller silver?"
    svar: "Det står inte angivet på förpackningen vilket material eller vilken legering smyckena är gjorda av, så vi kan inte uppge det. Har mottagaren extra känslig hud rekommenderar vi försiktighet."
  - fraga: "Passar kalendern som julklapp till en tonåring?"
    svar: "Ja, den är gjord för tonåringar och vuxna som gillar smycken. Förpackningen har en tydlig varning: ej för barn under 3 år på grund av smådelar."
  - fraga: "Hur lång är leveranstiden och kostar frakten något?"
    svar: "Leveranstid är 5–10 arbetsdagar, och frakten är fri både till Sverige och Norge."
  - fraga: "Kan jag lämna tillbaka kalendern om jag ångrar mig?"
    svar: "Ja, du har 14 dagars ångerrätt från att du tagit emot paketet."
  - fraga: "Får jag exakt de smycken som visas på bilden?"
    svar: "Bilden med alla smycken visar ett större sortiment än de 24 som ligger i just din ask – den visar stilen, inte det exakta innehållet. Vad som ligger bakom varje lucka är en överraskning."

