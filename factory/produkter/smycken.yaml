beskrivning:
  problem_rubrik: "Fel längd. Fel stil. Fel dag."
  problem_text: "Du ska ge en tjej eller kvinna smycken i julklapp, men smak är svårt att gissa – fel längd på en kedja, fel stil på ett par örhängen, och klappen hamnar i en byrålåda i stället för på henne. Ett enda utvalt smycke är ett litet lotteri."
  losning_rubrik: "24 luckor, 24 chanser att träffa rätt"
  losning_text: "Den här kalendern satsar inte på ett smycke utan tjugofyra: halsband, örhängen och ringar blandat bakom var sin lucka, i guld- och roséguldton med enstaka silverfärgade. Är inte lucka 3 hennes stil är lucka 4 en annan – och allt ligger redan i asken, klart att ge bort."

vinkel:
  huvudvinkel: "24 luckor, redan fyllda — ur verifierade fakta om varan, En färdigfylld adventskalender i kartong med 24 luckor, där varje lucka innehåller ett mod"
  underrubrik: "Färdigfylld med 24 blandade smycken i guld- och roséguldton – redo att ge bort direkt."
  usp: "24 luckor, redan fyllda"

malgrupp:
  beskrivning: "Den som ska ge en tonåring eller vuxen kvinna som gillar smycken en julklapp, och vill undvika att gissa fel på EN enda modell."

problem:
  - "Att välja ETT smycke i julklapp är att gissa på stil, längd och färg."
  - "En felvald kedja eller ring läggs i en byrålåda och glöms bort."
  - "Ett enda köp ger bara ett svar – träffar det inte hennes smak finns ingen reserv."

benefits:
  - "Ett nytt smycke att se fram emot varje dag fram till julafton."
  - "Ingen gissning på EN modell – 24 olika att träffa rätt med."
  - "Blandat innehåll (halsband, örhängen, ringar) ökar chansen att det matchar hennes stil."
  - "Färdigfylld och klar att ge bort direkt ur kartongen – inget att komplettera."

features:
