faq:
  - fraga: "Vad ligger bakom luckorna?"
    svar: "Golftillbehör i plast, metall och trä — bland annat golfbollar, peggar, bollmarkeringspennor, linjemarkörer, en greenlagare med spegel, en klubbrengöringsborste och en golfhandduk. Exakt vad som ligger bakom varje enskild lucka anger inte tillverkaren, så vi kan inte lista det lucka för lucka."
  - fraga: "Är kalendern färdigfylld, eller ska jag fylla den själv?"
    svar: "Färdigfylld. Alla 24 luckor har innehåll redan när kalendern kommer hem till dig — inget att köpa på och fylla i själv."
  - fraga: "Passar den för barn?"
    svar: "Den är gjord för vuxna och tonåringar som spelar golf, inte för yngre barn. Innehållet har små lösa delar som peggar och markörer, och tillverkaren anger varken CE-märkning eller åldersgräns — vi beskriver den därför aldrig som barnsäker."
  - fraga: "Hur stor är kartongen, går den att skicka direkt som present?"
    svar: "30 × 28 × 6 cm och väger ca 500 g. Den går fint att posta direkt till mottagaren."
  - fraga: "Vad händer om jag vill skicka tillbaka den?"
    svar: "Du har 14 dagars ångerrätt från att du fått paketet, som på alla köp hos oss."
  - fraga: "Hur lång är leveranstiden och kostar frakten något?"
    svar: "5–10 arbetsdagar, med fri frakt inom Sverige och Norge."

