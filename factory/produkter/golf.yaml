beskrivning:
  problem_rubrik: "Golfbagen tömmer sig i det tysta"
  problem_text: "Peggar knäcks, bollar försvinner i ruffen eller vattnet, borsten faller ur sidofacket — och ingen skriver upp det på en önskelista, för det känns för smått att önska sig. Så blir julklappen antingen en klubba han redan har, eller ett presentkort som hamnar i en låda till våren."
  losning_rubrik: "24 luckor, redan fyllda med det han ändå tar slut på"
  losning_text: "Den här kalendern har golftillbehör bakom varje lucka i stället för choklad: golfbollar, peggar i plast och trä, bollmarkeringar, en greenlagare med spegel, en klubbrengöringsborste och en golfhandduk, bland annat. Han öppnar en lucka om dagen fram till julafton — och det som ligger där är sånt som faktiskt hamnar i bagen, inte i en låda med julklappspapper kvar på."

vinkel:
  huvudvinkel: "Färdigfylld, inte en tom ask — ur verifierade fakta om varan, En FÄRDIGFYLLD adventskalender i papp (30 × 28 × 6 cm, ca 500 g) med 24 numrerade luckor s"
  underrubrik: "24 numrerade luckor, färdigfyllda med golftillbehör han faktiskt tar med till banan."
  usp: "Färdigfylld, inte en tom ask"

malgrupp:
  beskrivning: "Vuxna och tonåringar som spelar golf. Köps oftast som julklapp till en golfspelande man, pojkvän, pappa eller kompis — eller av golfaren själv som nedräkning till jul."

problem:
  - "Peggar, bollmarkeringar och greenlagare tar slut mitt i säsongen utan att han märker det själv."
  - "En ny klubba är för stort att önska sig. Ett presentkort känns för löst."
  - "De små sakerna är billiga var för sig — men ingen kommer ihåg att köpa in dem i tid till jul."

benefits:
  - "En julklapp han faktiskt använder på banan, inte nästa presenttips på en lista."
  - "24 dagars nedräkning till jul — inte en påse godis uppäten på tio minuter."
  - "Fyller på det han ändå köper själv, innan han hinner sakna det."
  - "Ett paket att slå in, inte 24 separata småpresenter att hålla reda på."

features:
  - "24 numrerade luckor, färdigfyllda med golftillbehör — inget att fylla i själv."
  - "Innehållet är golftillbehör i plast, metall och trä: bland annat golfbollar, peggar, bollmarkeringspennor, linjemarkörer, en kepsklämma med bollmarkör, en greenlagare med spegel, en T-nyckel för skonaglar med spikes, en klubbrengöringsborste, ett spårverktyg, nyckelringar och en golfhandduk med clips."
  - "Kartong: 30 × 28 × 6 cm, ca 500 g — går att skicka direkt som present."
  - "Riktar sig till vuxna och tonåringar som spelar golf. Tillverkaren anger varken CE-märkning eller åldersgräns, så den beskrivs aldrig som barnsäker."

