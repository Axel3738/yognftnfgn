beskrivning:
  problem_rubrik: "Blöta strumpor avgör turen före trötta ben"
  problem_text: "Snö nerifrån, blöt sly och grus som letar sig ner i kängan. Det är sällan vädret som avbryter turen — det är det som tar sig in nedtill. Två timmar in börjar strumpan suga, och resten av dagen går åt till att tänka på fötterna."
  losning_rubrik: "Damasker som stänger till mellan känga och knä"
  losning_text: "Kroka fast i snörningen, dra remmen under foten och slut kardborren runt benet. 44 centimeter skydd i tätvävd polyester håller snö, väta och grus ute hela vägen upp. En storlek som justeras efter benet — de sitter kvar i steget, inte bara när du står still."

vinkel:
  # HUVUDVINKELN ÄR INTE GISSAD. Källkampanjen 120250009391470291 har
  # spenderat 12 198 kr på 18 annonser (avläst 2026-09-09). Vinnaren är
  # Damasker_PD_1 — produktdemo: 9 638 kr, 51 köp, ROAS 2,83, CPA 189 kr,
  # mot break-even-ROAS 1,60. Den ensam står för 79 % av spenden och 88 % av
  # köpen. Näst bästa vinkel (SP, social proof) ligger på ROAS 1,42 — UNDER
  # break-even. Demon är butikens vinkel.
  huvudvinkel: "Produktdemo av påtagningen: krok i snörningen → rem under foten → kardborre runt benet, med vatten och grus som studsar av (källa: Damasker_PD_1, ROAS 2,83 på 9 638 kr i MagiBorsten)"
  underrubrik: "44 cm skydd mellan känga och knä — snön, vätan och gruset stannar utanför"

malgrupp:
  beskrivning: "Vandrare, jägare, hundägare och skogsfolk 30–65 i Sverige och Norge. Praktiska köpare som redan äger kängorna och vet exakt hur en blöt strumpa känns vid kilometer fyra. De pratar om turen, terrängen och vädret — inte om plagg. Köper det som funkar och som håller en säsong till, inte det som är snyggast."

problem:
  - "Snö och väta tar sig in i kängan uppifrån och blöter ner strumpan"
  - "Grus och barr letar sig ner i skon och skaver resten av turen"
  - "Blöt sly och högt gräs gör byxbenet genomvått på tjugo minuter"
  - "Billiga benskydd glider ner eller lossnar efter några kilometer"
  - "Svårt att synas i terrängen under jakt och i skymning"

benefits:
  - "Strumporna håller sig torra hela turen — inga blöta fötter vid kilometer fyra"
  - "Inget grus i kängan, alltså inga stopp för att skaka ur skon"
  - "Byxbenet håller sig torrt genom blöt sly och högt gräs"
  - "Sitter kvar i steget tack vare krok, rem och kardborre — inte bara när du står still"
  - "Syns i terrängen i neongrön, orange eller gul när ljuset går ner"
  - "Passar de flesta vuxna direkt — en storlek som justeras efter benet"

features:
  - "44 cm höjd — täcker hela vägen från känga till under knät"
  - "43 cm omkrets, justerbar — en storlek som passar de flesta vuxna"
  - "100 % polyester, tätvävd"
  - "Krok som fäster i kängans snörning"
  - "Justerbar rem under foten som håller damasken på plats"
  - "Kardborrestängning längs hela utsidan — går på och av med kängan på"
  - "18 färger, inklusive signalfärgerna neongrön, orange och gul"

offer:
  beskrivning: "389 kr per par (ord. 649 kr). Fri frakt till Sverige och Norge, 14 dagars ångerrätt."
  bundle: "Paketnivåer 1/2/3 par — mittennivån förvald enligt fabriksregeln"
  # Q4-RAMVERKET (standard för varje OPS). Vald bonus: reflexband.
  # Varför just det: produktens fjärde sälj-punkt är redan "syns i terrängen",
  # så bonusen förstärker ett löfte sidan redan gör i stället för att införa
  # ett nytt. Låg COGS, väger ingenting, samfraktas i samma påse.
  # ⚠️ handle är TOM — produkten är vald, inte sourcad. Fyll i när den ligger
  # i butiken; utan handle kan byggKorgUpsell inte rita korg-upsellen.
  bonus_produkt:
    titel: "Reflexband för ben & arm – 2-pack"
    handle: ""
    pris: 149
    i_paket: "Gratis i nivå 2 och 3, med antalet följande paketantalet (2 par ⇒ 2 st, 3 par ⇒ 3 st). Nivå 1 får den som betald kryssruta till fullpris 149 kr — aldrig rabatterad, annars blir 'värde 298 kr' på paketen en lögn."

