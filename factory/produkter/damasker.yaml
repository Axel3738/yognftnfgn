faq:
  - fraga: "Passar de min kängstorlek?"
    svar: "Ja. Damaskerna har en storlek med 43 cm omkrets och justeras med kardborre och remmen under foten, så de sitter på allt från lätta vandringskängor till grövre jaktkängor."
  - fraga: "Går de att ta på med kängorna på?"
    svar: "Ja. Kardborren löper längs hela utsidan, så du sveper dem runt benet utan att ta av skon."
  - fraga: "Håller de för snö och inte bara regn?"
    svar: "Ja. De är 44 cm höga och sluter tätt runt kängan, så snö som yr upp nerifrån stannar utanför."
  - fraga: "Glider de inte ner när jag går?"
    svar: "Nej. Kroken fäster i kängans snörning och remmen går under foten — det är de två sakerna som håller dem på plats i steget."
  - fraga: "Kan jag tvätta dem?"
    svar: "Skölj av lera och grus i kallt vatten och låt dem lufttorka. Materialet är 100 % polyester."
  - fraga: "Levererar ni till Norge?"
    svar: "Ja. Fri frakt till både Sverige och Norge."

