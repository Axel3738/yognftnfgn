beskrivning:
  problem_rubrik: "Regnet står kvar vid takluckan"
  problem_text: "Husvagnen eller husbilen står ute över vintern. Regnvatten samlas kring takluckor och skarvar, och ingen går upp och kollar förrän våren – då avgör fukttestet om tätningarna höll."
  losning_rubrik: "CaraShell täcker bara taket"
  losning_text: "CaraShell täcker takytan, med kanten hängande 30–40 cm ner över sidorna, så regnvatten inte blir stående vid takluckorna. Vävda spännband med plastkrokar hakar under karossens kant och sitter kvar i blåst. En person sätter på det själv."

vinkel:
  huvudvinkel: "Taket är ytan du aldrig ser — och den som kostar mest att laga. Konflikt typ A mot helöverdraget (tungt, två personer, skaver mot lacken) och före/efter (vattenpöl vid takluckan hela vintern mot torrt tak). Källa: källkampanjen 'Taköverdraget för Husvagn 6,5 × 3 m' i MagiBorsten (16 annonser, 15 köp på 2 563 kr, ROAS 6,61 de första två dygnen 2026-09-09–10; vinnaren Takoverdrag_PD_2_H1 är problem-driven) och källsidans egen rubrik 'Taket är det du aldrig ser'."
  underrubrik: "Taköverdrag i nio längder, 5,5 till 13,5 meter, alla 3 meter breda – täcker takytan och håller regnvatten borta från takluckor och skarvar över vintern."
  usp: "Bara taket. En person."

malgrupp:
  beskrivning: "Husvagns- eller husbilsägare 45–70 som ställer upp fordonet utomhus över vintern – på tomten, uppställningsplatsen eller campingens vinterplats. Fordonet är värt 200 000–1 000 000 kr. Säger 'fukttest', 'takluckor' och 'ställa upp', fruktar fuktskadan och vet att helöverdraget är tungt och kräver två personer."

problem:
  - "Regnvatten som blir stående vid takluckan"
  - "Skarvar och tätmassa som blöts hela vintern"
  - "Fukttestet vid vårservicen"
  - "Helöverdrag som kräver två personer"

benefits:
  - "Torrt tak fram till våren"
  - "Lugn inför fukttestet"
  - "Sätts på utan att be om hjälp"
  - "Lacken slipper skava mot ett tungt helöverdrag"

features:
  # Leverantörens svar 2026-09-17 (Axel): band ca 2,5 m, 210D Oxford
  # vattentät och soltålig, band på 4 sidor, justerbar längd, krok i nederkant,
  # två 10,5 m förstärkta band medföljer, storlekar 3×5,5 till 3×13,5 m.
  - "Nio storlekar: 5,5 till 13,5 m långt, 3 m brett – välj efter ditt tak"
  - "Svart 210D Oxford-väv, vattentät och tål sol"
  - "Vävda spännband (inte gummi, töjs inte ut) på alla fyra sidor, justerbara, med plastkrokar som hakar under karossens kant"
  - "Två extra förstärkta band på 10,5 m följer med"
  - "Sätts på av en person"
  - "Kanten hänger ner ca 30–40 cm över sidorna"

offer:
  beskrivning: "1 129 kr (jämförpris 1 469 kr), fri frakt till Sverige och Norge, 14 dagars ångerrätt enligt svensk lag och leverans på 5–10 arbetsdagar."
  bundle: "2 st – 15 % rabatt (förvald, 'Mest populär'). 3 st – 20 % rabatt. Exakt källans Kaching-nivåer (output/takskyddet/kalla-kaching-paket.json) = fabrikens standard-A."
  # A = källans Kaching-nivåer (identiska med paket.mjs NIVAER.a), B = ett
  # steg djupare rabatt. Inga egna nivåer behövs — mitten förvald.
  paket:
    test: "paket"
    # AV sedan 2026-09-24 (Axels beslut: "vi ab testar inte rabatter" — A
    # mot B gav 152 mot 144 köp, ingen skillnad). Temat skriver "#paket":
    # A syns i alla marknader, B-nivåerna och B-koderna står kvar dolda.
    # Ta inte bort id:t — då renderar paketblocket noll nivåer (tema.mjs
    # paketTest). true slår på testet igen.
    test_aktivt: false
    # Samma steg som fabrikens standard-A/B (paket.mjs NIVAER) — utskrivna
    # här bara för att TA BORT brickan "Bäst pris" på 3-packet (Axels order
    # 2026-09-17). Rabatt, koder (CARASHELLROO2A …) och handles är oförändrade.
    nivaer:
      - variant: a
        antal: 1
        rubrik: "1 st"
        underrubrik: "Standard pris"
      - variant: a
        antal: 2
        rabatt: 0.15
        rubrik: "2 st"
