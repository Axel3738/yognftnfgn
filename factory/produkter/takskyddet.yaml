    titel: "Termoskydd Husbil 211 × 171 cm"
    handle: "termoskyddet"
    produkt_id: "16108121489740"
    variant_id: "58826594156876"
    pris: 559
    i_paket: ""
    # false med flit: fullpris-kryssrutan (opf-tillagg) byggs bara i
