  # "Variant: 5,5 × 3 m" (Axels beslut 2026-09-18, efter att han sett
  # varukorgen som finsk kund). Översätts per språk — Koko / Størrelse / Size.
  variantrubrik: "Storlek"
  # Ordet i paketrutans rullgardiner ("Överdrag 1", "Överdrag 2") — sedan
  # 2026-09-17 när produkten fick nio storlekar. Kunden kan blanda storlekar
  # i ett paket (Axels beslut samma dag).
  enhet:
    sv: "överdrag"
    nb: "trekk"
