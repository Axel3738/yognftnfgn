faq:
  - fraga: "Passar det min husvagn eller husbil?"
    svar: "Måtten är 6,5 × 3 m och täcker hela takytan med marginal – mät takytan på ditt fordon och jämför. Passar både husvagn och husbil."
  - fraga: "Hur fäster jag överdraget?"
    svar: "Elastiska spännband med plastkrokar hakar under karossens kant, längs sidorna."
  - fraga: "Sitter det kvar i blåst?"
    svar: "Ja, de elastiska spännbanden håller det på plats i blåst."
  - fraga: "Hur många behövs för att lägga på det?"
    svar: "En person räcker, eftersom överdraget bara täcker taket."
  - fraga: "Vad gäller om jag ångrar mig?"
    svar: "14 dagars ångerrätt enligt svensk lag. Mejla hello@carashell.se."

