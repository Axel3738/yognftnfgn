faq:
  - fraga: "Vilken storlek ska jag välja?"
    svar: "Taköverdraget finns i nio längder, 5,5 till 13,5 meter, alla 3 meter breda. Mät taket från front till bakkant och välj närmaste längd uppåt. Passar både husvagn och husbil."
  - fraga: "Hur fäster jag överdraget?"
    svar: "Vävda spännband med plastkrokar hakar under karossens kant, längs sidorna."
  - fraga: "Sitter det kvar i blåst?"
    svar: "Ja, de vävda spännbanden håller det på plats i blåst. De är inte av gummi, så de töjs inte ut."
  - fraga: "Hur många behövs för att lägga på det?"
    svar: "En person räcker, eftersom överdraget bara täcker taket."
  - fraga: "Vad gäller om jag ångrar mig?"
    svar: "14 dagars ångerrätt enligt svensk lag. Mejla hello@carashell.com."

