# CaraShell — produkt 1: Taköverdrag Husvagn & Husbil 6,5 × 3 m.
# Källa: baverbutiken.se/products/takoverdrag-husvagn-6-5-3-m-skyddar-den-dyraste-ytan
# Specs, pris och recensioner lästa ur källan 2026-09-10. Bilderna är facit
# (leverantörens): helintegrerad husbil med svart överdrag över taket, kanten
# hänger 30–40 cm ner över sidorna, vävda spännband (inte gummi) med plastkrokar som
# hakar under karossens kant. Källtexten säger "husvagn", bilderna visar en
# husbil — produkten passar båda och copyn säger båda.
# Okänt och därför aldrig påstått: förvaringspåse (nämns i källtexten, syns
# inte), dragsko (syns inte), vikt, exakta vagnlängder.
#
# Copyn (svenska) skrevs 2026-09-10 av en subagent (sonnet) ur BRAND.md +
# docs/copy-regler.md, tre-frågorstestet ✅ på alla rubrikrader; vinkel,
# målgrupp och struktur är huvudsessionens. Underlaget: output/carashell/BRAND.md.

