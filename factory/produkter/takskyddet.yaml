  # gid://shopify/PriceList/33455505740 i marknadskatalogen "Norge", 2026-09-11,
  # efter att Axel slagit på NOK som marknadens basvaluta). Jämförpriset är
  # Axels val: 25 % över priset (alternativet 1 474,67 = 25 % rabatt).
  # paket.mjs räknar paketnivåernas NOK-tal härifrån (samma procent) och
  # skriver dem i nivåns fastpris_valutor, så den norska vyn visar NOK.
  # Fasta priser följer INTE valutakursen — ändras SEK-priset sätts de om.
  marknadspriser:
    - valuta: NOK
      pris: 1106
      jamforpris: 1382.50
