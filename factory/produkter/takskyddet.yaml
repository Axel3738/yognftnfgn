  moms_antagen: false
  # ⚠️ HÄRLEDD, inte kvitterad: källkampanjens namn bär "BE ROAS 1.63" och
  # docs/temu-launch-flow.md säger BE-ROAS = pris / (pris − inköp) ⇒
  # 1129 − 1129/1,63 = 436 kr. Axel bekräftar mot Temu-kvittot innan talet
  # får döma annonser.
  inkopskostnad: 436
  pris: 1129
  jamforpris: 1469
  # Ur källkampanjens namn (MagiBorsten 120250147343350291, 2026-09-10).
  break_even_roas: 1.63
  # FASTA PRISER PER MARKNADSVALUTA — satta som prislista i Shopify (Norge:
  # gid://shopify/PriceList/33455505740 i marknadskatalogen "Norge", 2026-09-11,
  # efter att Axel slagit på NOK som marknadens basvaluta). Jämförpriset är
  # Axels val: 25 % över priset (alternativet 1 474,67 = 25 % rabatt).
  # paket.mjs räknar paketnivåernas NOK-tal härifrån (samma procent) och
  # skriver dem i nivåns fastpris_valutor, så den norska vyn visar NOK.
  # Fasta priser följer INTE valutakursen — ändras SEK-priset sätts de om.
  marknadspriser:
    - valuta: NOK
      pris: 1106
      jamforpris: 1382.50
    # USD — Axels pris 2026-09-16 (/ny-marknad carashell US --pris 199), INTE
    # en kursomräkning (1 129 kr × 0,10235 = 115,55 USD, ECB 2026-09-15).
    # Jämförpriset följer samma regel som NOK: 25 % över priset (248,75 → 249).
    # Fast pris i prislistan gid://shopify/PriceList/33459372364 (prislista.mjs,
    # 2026-09-16 efter att USD blivit marknadens basvaluta i admin) —
    # tillbakaläst som amerikansk kund: $199.00 / $249.00.
    - valuta: USD
      pris: 199
      jamforpris: 249
    # EUR — Finland 2026-09-18. Referensraden är 6,5 m ur Axels finska
    # prislista (CWD:s riktiga FI-offert 45,76 USD ⇒ 126,90 €). Varje storlek
    # har sitt EGET EUR-pris i varianterna nedan; den här raden gäller bara om
    # en variant saknar eget (och då stoppar granskaVariantpriser körningen).
    - valuta: EUR
      pris: 126.90
      jamforpris: 165.90
    # DKK — Danmark 2026-09-20. Axels beslut samma dag på frågan om prisnivå:
    # "kör ett snäpp högre, danska quotes brukar vara dyrare än Sverige med
    # kanske 10 %". Alltså SEK × 0,66204 (ECB 2026-09-18) × 1,10, avrundat
    # till x9 — inte en ren kursomräkning. Jämförpriset räknas på samma sätt
    # ur SEK-jämförpriset, så rabattprocenten blir densamma som i Sverige
    # (23 %). Varje storlek har sitt EGET DKK-pris i varianterna nedan.
    - valuta: DKK
      pris: 819
      jamforpris: 1069

