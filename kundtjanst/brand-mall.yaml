# =============================================================
# KUNDTJÄNST — BRANDFIL (ett brand per fil)
# =============================================================
# Kopiera till kundtjanst/brands/<id>.yaml. <id> = kort, gemener, inga å/ä/ö.
#
# En OPS-butik som redan har factory/butiker/<id>.yaml BEHÖVER ingen brandfil:
# brand, supportmail och shop läses därifrån. Lägg en fil med SAMMA id bara
# för att lägga till något (Notion-SOP-databas, Discord-kanal, egna trösklar)
# eller stänga av brandet (aktiv: false).
#
# Hemligheter ligger ALDRIG här. De heter så här i Environments på claude.ai
# (<ID> = id i VERSALER, allt som inte är A–Z/0–9 blir _):
#   KUNDTJANST_MAIL_PASS_<ID>       Loopia-lösenordet till brevlådan        KRÄVS
#   KUNDTJANST_MAIL_USER_<ID>       bara om användarnamnet inte är supportmailen
#   SHOPIFY_SHOP_<ID> + SHOPIFY_ADMIN_TOKEN_<ID>   (eller CLIENT_ID + CLIENT_SECRET)
#   NOTION_TOKEN, DISCORD_BOT_TOKEN, ANTHROPIC_NYCKEL   delade

brand:
  namn: ""                    # KRITISKT — namnet som visas i rapporten
  supportmail: ""             # KRITISKT — brevlådan rutinen läser (Loopia: också användarnamnet)
  shop: ""                    # xxxx-xx.myshopify.com — tomt = inga ordrar/tvister
  land: SE
  valuta: SEK
  aktiv: true                 # false = hoppas över av --alla

mail:
  host: mailcluster.loopia.se # Loopia. Annan leverantör: byt här
  port: 993
  # auto = IMAP där nätet tillåter det, annars webbmejlen över HTTPS (claude.ai
  # släpper bara HTTPS, mätt 2026-09-12). imap / webmail tvingar en väg.
  via: auto
  webmail: https://webmail.loopia.se/   # Roundcube — samma inloggning som brevlådan
  inkorg: INBOX
  # Skickat-mappen provas i ordning; `node kundtjanst/setup.mjs --mappar <id>` visar namnen
  skickat:
    - Sent
    - INBOX.Sent
    - Skickat

discord:
  server: ""                  # servern boten postar i (namn eller id). Tomt = brandets namn
  kanal: customer-service     # kanalen — skapas av boten om den saknas

shopify:
  # Tomt = nycklarna heter SHOPIFY_CLIENT_ID_<ID> osv. Heter de något annat
  # (t.ex. en egen app bara för kundtjänsten) skriv svansen här:
  # "BAVERBUTIKEN_EMAILSCRAPER" ⇒ SHOPIFY_CLIENT_ID_BAVERBUTIKEN_EMAILSCRAPER.
  env_suffix: ""

notion:
  sop_database_id: ""         # VA:ns SOP-databas → rapporten säger vilka toppärenden som saknar SOP
  rapport_database_id: ""     # databas där veckorapporten läggs som sida (--notion)

# Värdena SOP:erna i kundtjanst/sop/ fyller sina {{PLATSHÅLLARE}} med. Samma
# SOP-text körs på alla butiker — det är bara det här blocket som skiljer dem
# åt, och det är hela poängen: en ny butik får fungerande tvisthantering genom
# att fylla i tio rader, inte genom att skriva om rutinerna.
tvister:
  returadress: ""             # {{RETURN_ADDRESS}} — hela adressen VA:n skickar till kunden
  # true = adressen står INTE publikt någonstans; kunden måste mejla kundtjänst
  # för att få den. Det ger färre returer, men bara om svaret går ut inom
  # forsta_svar_timmar nedan — ett missat mejl blir en tvist, och en tvist
  # kostar mer än returen. false = adressen står i policyn och får skickas fritt.
  returadress_pa_forfragan: true
  # {{RETURN_POSTAGE_PAID_BY}} — "kund" eller "butik". ⚠️ Lämna tom tills ägaren
  # sagt vilket; VA:n får aldrig gissa det i ett kundmejl.
  returfrakt_betalas_av: ""
  # {{RETURN_WINDOW_DAYS}} — butikens EGEN returpolicy. Läs den på policy_url,
  # gissa aldrig. ⚠️ Räknas från att kunden MOTTOG varan, inte från ordern —
  # med 3–4 veckors leveranstid är det en helt annan dag. (Mätt 2026-09-20:
  # VA:n bedömde #5435 som "13 dagar efter orderbekräftelsen, inom 14-dagars-
  # policyn" — i själva verket hade varan inte ens levererats än, och butikens
  # policy är 30 dagar, inte 14.)
  returfonster_dagar: 30
  # {{WITHDRAWAL_WINDOW_DAYS}} — den LAGSTADGADE ångerrätten, som gäller
  # parallellt med returpolicyn ovan och inte går att avtala bort. 14 dagar i
  # EU/Sverige (distansavtalslagen 2005:59), räknat från mottagandet. Utanför
  # EU: sätt det landets regel, eller 0 om ingen finns.
  angerratt_dagar: 14
  policy_url: ""              # {{POLICY_URL}} — sidan kunden godkände i kassan (returer/villkor)
  # {{BILLING_DESCRIPTOR}} — texten som står på kundens kontoutdrag. Står den inte
  # här gissar ingen: läs den i Shopify admin → Settings → Payments → Customer
  # billing statement. Fel descriptor är en vanlig orsak till "unrecognized".
  billing_descriptor: ""
  # Under det här beloppet är det billigare att återbetala än att lägga VA-tid på
  # att slåss. 0 = slåss alltid. Sätt det i butikens egen valuta.
  strid_lonar_sig_over: 0

  # Eskaleringen — kundtjanst/sop/60-ESCALATION.md. Utan de här tre raderna vet
  # VA:n inte vem hon frågar, och frågar då ingen alls.
  agare_kontakt: ""           # {{OWNER_CONTACT}} — namn + var (Discord-handle, mejl)
  # {{REFUND_APPROVAL_LIMIT}} — belopp VA:n får återbetala eller acceptera utan
  # att fråga, i butikens valuta. 0 = hela kön får beslutas själv.
  godkannande_over: 0
  ersattning_over: 0          # {{REPLACEMENT_LIMIT}} — samma sak för ersättningsvaror
  # {{FIRST_REPLY_TARGET_HOURS}} — svarstidsmålet på kundmejl. Det är det här
  # talet som avgör om returadress_pa_forfragan ovan är en bra idé eller en
  # tvistgenerator.
  forsta_svar_timmar: 24

trosklar:
  arenden_dagar: 30           # hur långt bakåt mejlen läses. ⚠️ Sänk den inte till 7 —
                              # då faller allt obesvarat äldre än en vecka ur rapporten,
                              # alltså precis de ärenden som hunnit bli farligast
  obesvarad_timmar: 48        # inkommande utan svar längre än så = larm
  ofullbordad_dagar: 5        # betald order utan fulfillment längre än så = larm
  tvistgrans_gul_procent: 0.5 # tvister / ordrar (30 dagar): gult härifrån
  tvistgrans_rod_procent: 0.9 # rött härifrån (Visa 0,9 %, Mastercard 1 %)
  ordrar_dagar: 30
