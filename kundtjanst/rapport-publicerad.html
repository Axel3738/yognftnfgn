      --linje: #273239;
      --linje-stark: #3A4852;
      --blakk: #8DB8F0;
      --blakk-yta: #1A2C44;
      --lag: #6CCB93;       --lag-yta: #14301F;
      --forhojd: #E9B549;   --forhojd-yta: #3A2C0C;
      --hog: #F08A7E;       --hog-yta: #43201B;

  }
  :root[data-theme="dark"] {
    --ground: #0E1418;
    --yta: #161E24;
    --yta-2: #1B252C;
    --ink: #E6ECF0;
    --ink-svag: #93A3AE;
    --linje: #273239;
    --linje-stark: #3A4852;
    --blakk: #8DB8F0;
    --blakk-yta: #1A2C44;
    --lag: #6CCB93;       --lag-yta: #14301F;
    --forhojd: #E9B549;   --forhojd-yta: #3A2C0C;

    --skugga: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 28px -18px rgba(0, 0, 0, 0.9);

  * { box-sizing: border-box; }
  body {

    background: var(--ground);

  }
  .sida {

    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 28px 64px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  a { color: var(--blakk); }
  :focus-visible { outline: 3px solid var(--blakk); outline-offset: 2px; }

  /* ---------- Huvud ---------- */
  .huvud { display: flex; flex-direction: column; gap: 14px; }
  .huvud h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(30px, 5vw, 42px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .huvud .under { color: var(--ink-svag); margin: 0; font-size: 15px; }
  .veckor { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .veckor .etikett { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-svag); margin-right: 4px; }
  .veckor button {
    font: inherit; font-size: 15px; font-weight: 700;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--linje-stark); background: var(--yta); color: var(--ink);

  .pill.okand { background: var(--yta-2); color: var(--ink-svag); }

  .kort .kurva-text { font-size: 12px; color: var(--ink-svag); }

  .md p { margin: 8px 0; max-width: 68ch; }
  .md ul, .md ol { margin: 6px 0; padding-left: 24px; max-width: 70ch; }
  .md li { margin: 3px 0; }

  .md code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.92em; background: var(--yta-2); padding: 1px 5px; border-radius: 5px; }
  .md .tabell { overflow-x: auto; margin: 8px 0 12px; }
  .md table { border-collapse: collapse; font-size: 15px; min-width: 100%; }
  .md th, .md td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--linje); vertical-align: top; }

efund or cancellation in writing today; the money must be back within 14 days.<\/li><\/ol>\n<\/section>"}}}],"ranking":{"2026-W37":"<h1>Chargeback-ranking alla brands — vecka 2026-W37<\/h1>\n<p>Högst risk först. Poängen är summan av signalerna (0–100); nivån 🟢 &lt; 25, 🟡 25–50, 🔴 &gt; 50.<\/p>\n<div class=\"tabell\"><table><thead><tr><th>Plats<\/th><th>Brand<\/th><th>Risk<\/th><th>Ärenden<\/th><th>Obesvarade &gt; gräns<\/th><th>Tvister<\/th><th>Tvistgrad<\/th><th>Toppärende<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Bäverbutiken<\/td><td>🔴 Hög (100/100)<\/td><td>45<\/td><td>37<\/td><td>—<\/td><td>—<\/td><td>Var är min order (WISMO) (17)<\/td><\/tr><\/tbody><\/table><\/div>"},"kategorier":{"chargeback_hot":{"sv":"Hot om bank/tvist","en":"Threatens bank / dispute"},"okand_debitering":{"sv":"Okänd/dubbel debitering","en":"Unknown or double charge"},"ej_levererad":{"sv":"Aldrig levererad","en":"Never delivered"},"fel_vara":{"sv":"Fel vara / inte som beskrivet","en":"Wrong item / not as described"},"var_ar_ordern":{"sv":"Var är min order (WISMO)","en":"Where is my order (WISMO)"},"skadad_defekt":{"sv":"Skadad / defekt","en":"Damaged / defective"},"aterbetalning":{"sv":"Vill ha pengar tillbaka","en":"Wants a refund"},"avbestallning":{"sv":"Avbeställning","en":"Cancellation"},"retur_angerratt":{"sv":"Retur / ångerrätt","en":"Return / right of withdrawal"},"faktura_klarna":{"sv":"Faktura / Klarna","en":"Invoice / Klarna"},"produktfraga":{"sv":"Produktfråga (före köp)","en":"Product question (pre-sale)"},"rabatt_kod":{"sv":"Rabattkod / erbjudande","en":"Discount code / offer"},"spam":{"sv":"Spam / marknadsföring","en":"Spam / marketing"},"ovrigt":{"sv":"Övrigt","en":"Other"}}};

  const NIVA = (p) => (p === null || p === undefined ? { id: 'okand', text: 'ingen mätning', emoji: '⚪' }
    : p >= 50 ? { id: 'hog', text: 'Hög', emoji: '🔴' } : p >= 25 ? { id: 'forhojd', text: 'Förhöjd', emoji: '🟡' } : { id: 'lag', text: 'Låg', emoji: '🟢' });
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const el = (id) => document.getElementById(id);
  const veckor = DATA.veckor.slice().sort().reverse();
  let vald = veckor[0] ?? null;

  function radFor(brand, vecka) { return (brand.historik || []).find((h) => h.vecka === vecka) ?? null; }

  /** Riskkurvan över veckorna: en punkt per vecka, band vid 25 och 50. */
  function kurva(brand) {
    const rader = (brand.historik || []).slice().sort((a, b) => a.vecka.localeCompare(b.vecka));
    if (!rader.length) return '<p class="kurva-text saknas">Ingen historik än.</p>';
    const B = 320, H = 54, m = 6, n = rader.length;
    const x = (i) => (n === 1 ? B / 2 : m + (i * (B - 2 * m)) / (n - 1));
    const y = (p) => H - m - ((Math.max(0, Math.min(100, p ?? 0))) * (H - 2 * m)) / 100;
    const band = (p) => `<line x1="0" x2="${B}" y1="${y(p)}" y2="${y(p)}" stroke="var(--linje)" stroke-dasharray="3 4" />`;
    const punkter = rader.map((r, i) => `${x(i)},${y(r.riskPoang)}`).join(' ');
    const sista = rader[n - 1];
    const linje = n > 1 ? `<polyline points="${punkter}" fill="none" stroke="var(--blakk)" stroke-width="2" />` : '';
    const prickar = rader.map((r, i) => `<circle cx="${x(i)}" cy="${y(r.riskPoang)}" r="${i === n - 1 ? 4 : 2.5}" fill="${i === n - 1 ? 'var(--' + NIVA(r.riskPoang).id + ')' : 'var(--blakk)'}" />`).join('');
    const text = n > 1 ? `Risk vecka för vecka: ${rader.map((r) => `${r.vecka.slice(5)} = ${r.riskPoang}`).join(', ')}`
      : `Första mätningen ${sista.vecka}. Kurvan börjar nästa vecka.`;
    return `<svg viewBox="0 0 ${B} ${H}" role="img" aria-label="${esc(text)}">${band(25)}${band(50)}${linje}${prickar}</svg><p class="kurva-text">${esc(text)}</p>`;
  }

  function kort(brand, vecka) {
    const r = radFor(brand, vecka);
    const niva = NIVA(r?.riskPoang);
    const topp = r?.topp?.[0] ? (DATA.kategorier[r.topp[0]]?.sv ?? r.topp[0]) : '—';
    const gr = brand.trosklar?.obesvarad_timmar ?? 48;
    return `<a class="kort" href="#brand-${esc(brand.id)}">
      <p class="namn">${esc(brand.namn)}</p>
      <div class="tal-rad"><span class="poang">${r ? r.riskPoang : '–'}</span><span class="av">/ 100</span>
        <span class="pill ${niva.id}">${niva.emoji} ${esc(niva.text)}</span></div>
      <dl>
        <dt>Ärenden</dt><dd>${r ? r.antalArenden : '—'}</dd>
        <dt>Obesvarade &gt; ${gr} h</dt><dd>${r ? r.larmObesvarade : '—'}</dd>
        <dt>Tvister</dt><dd>${r ? (r.tvister === null ? 'ej läsbart' : r.tvister) : '—'}</dd>
        <dt>Toppärende</dt><dd class="text">${esc(topp)}</dd>
      </dl>
      ${kurva(brand)}
    </a>`;
  }

  function brandBlock(brand, vecka) {
    const v = brand.veckor?.[vecka];
    const id = esc(brand.id);
    if (!v) return `<article class="brand" id="brand-${id}"><div class="topp"><h2>${esc(brand.namn)}</h2></div><div class="rapport"><p>Ingen rapport skriven för ${esc(vecka)}.</p></div></article>`;
    return `<article class="brand" id="brand-${id}">
      <div class="topp"><h2>${esc(brand.namn)}</h2>
        <div class="flikar" role="tablist" aria-label="Språk">
          <button role="tab" id="flik-${id}-sv" aria-selected="true" aria-controls="rap-${id}-sv" data-flik="sv" data-brand="${id}">Till Axel</button>
          <button role="tab" id="flik-${id}-en" aria-selected="false" aria-controls="rap-${id}-en" data-flik="en" data-brand="${id}">To the VA (English)</button>
        </div></div>
      <div class="rapport md" id="rap-${id}-sv" role="tabpanel">${v.sv || '<p>Svensk rapport saknas.</p>'}</div>
      <div class="rapport md" id="rap-${id}-en" role="tabpanel" hidden>${v.en || '<p>English report missing.</p>'}</div>
    </article>`;
  }

  function rita() {
    const dag = DATA.uppdaterad ? new Date(DATA.uppdaterad) : null;
    el('under').textContent = vald
      ? `Vecka ${vald} · ${DATA.brands.length} brand${DATA.brands.length === 1 ? '' : 's'} · sidan byggd ${dag ? dag.toLocaleDateString('sv-SE') : '—'}`
      : 'Inga körningar än — första rapporten skrivs av måndagsrutinen.';
    el('veckor').innerHTML = veckor.length
      ? `<span class="etikett">Vecka</span>` + veckor.map((v) => `<button type="button" data-vecka="${esc(v)}" aria-pressed="${v === vald}">${esc(v.replace('-W', ' · v'))}</button>`).join('')
      : '';
    const sorterade = DATA.brands.slice().sort((a, b) => (radFor(b, vald)?.riskPoang ?? -1) - (radFor(a, vald)?.riskPoang ?? -1));
    el('kort').innerHTML = sorterade.length ? sorterade.map((b) => kort(b, vald)).join('') : '<div class="tomt">Inget brand har körts än.</div>';
    const rank = DATA.ranking?.[vald];
    el('ranking').hidden = !rank;
    el('ranking-md').innerHTML = rank || '';
    el('rapporter').innerHTML = sorterade.map((b) => brandBlock(b, vald)).join('');
  }

  document.addEventListener('click', (e) => {
    const v = e.target.closest('button[data-vecka]');
    if (v) { vald = v.dataset.vecka; rita(); return; }
    const f = e.target.closest('button[data-flik]');
    if (f) {
      const { brand, flik } = f.dataset;
      for (const sprak of ['sv', 'en']) {
        el(`flik-${brand}-${sprak}`).setAttribute('aria-selected', String(sprak === flik));
        el(`rap-${brand}-${sprak}`).hidden = sprak !== flik;
      }
    }
  });

  rita();
</script>
