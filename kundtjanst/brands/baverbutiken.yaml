# Bäverbutiken — Axels huvudbutik (general store, VA:n sköter kundtjänsten).
# Butiken är inte byggd av fabriken, så den behöver en egen brandfil.
#
# Brevlådan är kundsupport@baverbutiken.se på Loopia (MX mailcluster.loopia.se).
# ⚠️ Sajtens sidfot och /pages/contact visar kundsupport@baverkoppling.se —
# den domänen har INGEN MX-post (mätt 2026-09-12 via DNS: A-posten pekar på
# Shopify, ingen mejlserver), så mejl dit kan inte landa i någon brevlåda och
# webbmejlen nekar inloggning med den adressen (steg 2, HTTP 401). Första
# lyckade läsningen 2026-09-12: INBOX 264, INBOX.Sent 9. Sidfotens adress är
# en känd felskrivning (market-expansion/01-information-och-atkomst.md).
# Byter Axel adress: ändra här, eller sätt KUNDTJANST_MAIL_USER_BAVERBUTIKEN.
#
# Shopify-domänen kommer ur tools/kaching-cli/stores.json. Ordrar och
# tvister läses först när SHOPIFY_ADMIN_TOKEN_BAVERBUTIKEN (custom app med
# read_orders + read_shopify_payments_disputes) eller CLIENT_ID/SECRET finns.

brand:
  namn: "Bäverbutiken"
  supportmail: "kundsupport@baverbutiken.se"
  shop: "4snrw0-mg.myshopify.com"
  land: SE
  valuta: SEK
  aktiv: true

discord:
  server: "Bäverbutiken"
  kanal: customer-service

shopify:
  # Axels namn på nycklarna (2026-09-13): appen på dev.shopify.com för
  # kundtjänstrutinen heter "emailscraper" i Environments —
  # SHOPIFY_CLIENT_ID_BAVERBUTIKEN_EMAILSCRAPER + SHOPIFY_CLIENT_SECRET_BAVERBUTIKEN_EMAILSCRAPER.
  env_suffix: "BAVERBUTIKEN_EMAILSCRAPER"

notion:
  # VA:ns SOP-databas "Customer support bäverbutiken" (47 rader, kolumnen
  # Kategori: Payment, Delivery, Return and Refund …), länken Axel gav 2026-09-13.
  # (Den första länken 2026-09-12, 36f270ab…, var redigerarnas Creative Hub master.)
  sop_database_id: "3aa270ab-908c-8057-a8a0-cc691d9e956b"
  rapport_database_id: ""
