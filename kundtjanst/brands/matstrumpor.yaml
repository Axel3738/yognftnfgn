# Matstrumpor — tredje verksamheten (matstrumpor.se, kontot "nya kungen").
# Butiken är inte byggd av fabriken, så den behöver en egen brandfil.
#
# Brevlådan är kundsupport@matstrumpor.se (adressen läst live ur Shopifys
# shop.contactEmail 2026-09-21, sparning/butiker.json). Lösenordet heter
# KUNDTJANST_MAIL_PASS_MATSTRUMPOR i Environments — Axel lade in det
# 2026-09-23 ("Den ligger inne"). ⚠️ Vilken mejlleverantör butiken har är
# INTE mätt: mall-värdet Loopia står kvar tills första läsningen säger
# annat (felet nämner steget 1–6 som inte stämde).
#
# Shopify-domänen och nycklarna är samma som spårningsrutinen använder:
# appen "Fabriken" (SHOPIFY_CLIENT_ID_1r46tp_qx + SECRET). ⚠️
# SHOPIFY_SHOP_1r46tp_qx i Environments bär domänen med UNDERSTRECK — fel;
# sparning/butiker.json är facit (1r46tp-qx.myshopify.com), och `shop`
# nedan är avskrivet därifrån.

brand:
  namn: "Matstrumpor"
  supportmail: "kundsupport@matstrumpor.se"
  shop: "1r46tp-qx.myshopify.com"
  land: SE
  valuta: SEK
  aktiv: true

discord:
  # Matstrumpor har ingen egen Discord-server (mätt 2026-09-22, botten ser
  # elva servrar och ingen är Matstrumpors). Larmen går därför i Bäverbutikens
  # #customer-service — samma väg som tvistkollen och pingen till VA:n tar.
  server: "Bäverbutiken"
  kanal: customer-service
  # Mechile Delos Santos sköter alla butiker (bonus/personer.json brands: "*").
  va_id: "1543617780396593206"

shopify:
  env_suffix: "1r46tp_qx"

# Autosvaret (kundtjanst/autosvar.mjs) PÅ sedan 2026-09-23 — samma steg som
# CaraShell samma dag (Axels order). Railway kör det TORRT tills
# AUTOSVAR_LAGE_MATSTRUMPOR tas bort (stonebite/cowork/7-autosvar-matstrumpor.txt).
svar:
  autosvar: true
  sprak: sv
  signatur: "Kundtjänst Matstrumpor"
  leverans_dagar: [7, 14]
  packas_dagar: 2
  sparningssida: "https://matstrumpor.se/pages/spara"
  sparning_prefix: "MS-"
  va_mapp: VA-PRIO
  svarstid_timmar: 24
  max_per_korning: 20
  fonster_timmar: 72
  fraga_ordernummer: false

notion:
  # Ingen egen SOP-databas — VA:n använder Bäverbutikens bas (portabel, Store
  # facts bär Matstrumpors rad). Tomt = SOP-täckningen mäts inte här.
  sop_database_id: ""
  rapport_database_id: ""

# Tvistblocket (kundtjanst/brand-mall.yaml), ifyllt 2026-09-23. Källorna:
# matstrumpor.se/policies/refund-policy + terms-of-service (avlästa 200 samma
# dag), Shopify Admin API (shop.billingAddress) och Axels avläsning i admin
# (descriptor). shipping-policy, contact-information och legal-notice svarar 404.
tvister:
  # Shopifys faktureringsadress (sjöhed 160, 44274 harestad) — samma adress och
  # bolag som Bäverbutiken och CaraShell. Står INTE publikt i villkoren.
  returadress: "STONEBITE ECOM AB, Sjöhed 160, 442 74 Harestad, Sverige"
  # Policyn: "Om returen accepteras skickar vi dig en returfraktsedel samt
  # instruktioner … Artiklar som skickas tillbaka utan att retur först har
  # begärts accepteras inte." ⇒ mejla först.
  returadress_pa_forfragan: true
  # Villkoren § 5: "Kunden står för returfrakten om inget annat anges."
  # ⚠️ Returpolicyn lovar däremot "vi skickar dig en returfraktsedel". Axels
  # beslut 2026-09-23: kunden betalar — boten ger adressen direkt och skriver
  # "Returfrakten står du själv för".
  returfrakt_betalas_av: "kund"
  # Policyn: "30 dagars returpolicy … från det att du mottog artikeln", och
  # villkoren § 5: "Vi erbjuder 30 dagars öppet köp". Stod 14 (mallvärdet)
  # före 2026-09-23. Bäverbutiken har 14 — Matstrumpors publicerade sida säger 30.
  returfonster_dagar: 30
  angerratt_dagar: 14
  policy_url: "https://matstrumpor.se/policies/refund-policy"   # 200, avläst 2026-09-23
  # Avläst av Axel 2026-09-23 i Shopify admin → Settings → Payments →
  # "Uppgifter för kundens kontoutdrag" (appen saknar read_shopify_payments,
  # API:t nekar fältet).
  billing_descriptor: "SP Matstrumpor.se"
  # Shopify billingAddress.phone (mätt 2026-09-23) — samma nummer som
  # Bäverbutiken och CaraShell.
  support_telefon: "+46 79 340 44 07"
  strid_lonar_sig_over: 0
  sparningssida: "https://matstrumpor.se/pages/spara"
  paketprefix: "MS-"
  agare_kontakt: "Axel (Discord #customer-service)"
  godkannande_over: 0
  ersattning_over: 0
  forsta_svar_timmar: 24
