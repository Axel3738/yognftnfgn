# StonePNL — publika App Store-appen. Deployas med `shopify app deploy`;
# efterlevnads-webhookarna kan bara konfigureras den här vägen.
name = "StonePNL"
client_id = "8200cbe4502be19ac6ebe75ac65e3ad2"
application_url = "https://pnl-app-store-production.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_products,read_orders,read_inventory,read_reports,write_inventory"

[auth]
redirect_urls = [
  "https://pnl-app-store-production.up.railway.app/auth/callback",
  "https://pnl-app-store-production.up.railway.app/auth/shopify/callback",
  "https://pnl-app-store-production.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://pnl-app-store-production.up.railway.app/webhooks"

  # Obligatoriska för App Store — dashboarden saknar UI för dessa.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://pnl-app-store-production.up.railway.app/webhooks"

[build]
automatically_update_urls_on_dev = false
